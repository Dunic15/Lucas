name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 · key-free suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRAIN_PROVIDER: stub
      EMBEDDING_PROVIDER: hash
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # pgserver = embedded Postgres so the control-plane RLS tests
        # (backend/tests/test_control_plane_pg.py, marker `pg`) RUN in CI
        # instead of skipping; the rest of the suite stays key-free.
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt 'pytest>=8,<10' pgserver

      - name: Backend tests
        run: python -m pytest backend/tests -q -p no:cacheprovider

      - name: Conversation evals
        run: python -m pytest tests -q -p no:cacheprovider


  frontend:
    name: Node 24 · marketing build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lovable/laura-meeting-expert

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build marketing app
        run: npm run build
