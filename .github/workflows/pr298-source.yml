name: PR298 Source

on:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr298-source
          path: |
            backend/app/config.py
            backend/app/main.py
            backend/tests/test_action_deps_release.py
            backend/tests/test_dashboard_approve.py
