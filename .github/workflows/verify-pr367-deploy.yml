name: Diagnose PR 367 production deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-pr367-deploy.yml"

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 733bb2d2b3f41a5b928902c22dd78c7710028dd9
      BASE_URL: https://dhfgfe6yw6.eu-central-1.awsapprunner.com
      SERVICE_ARN: arn:aws:apprunner:eu-central-1:836739852304:service/laura-backend/f169c4a486cd47bfac9736ab01367a26
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::836739852304:role/GitHubActionsEcrPush
          aws-region: eu-central-1

      - name: Diagnose ECR and App Runner
        shell: bash
        run: |
          set +e
          ecr=$(aws ecr describe-images --repository-name laura-backend \
            --image-ids imageTag="$TARGET_SHA" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt,tags:imageTags}' \
            --output json 2>&1)
          ecr_rc=$?
          service=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" \
            --query 'Service.{status:Status,image:SourceConfiguration.ImageRepository.ImageIdentifier,auto:SourceConfiguration.AutoDeploymentsEnabled,updated:UpdatedAt,url:ServiceUrl}' \
            --output json 2>&1)
          service_rc=$?
          operations=$(aws apprunner list-operations --service-arn "$SERVICE_ARN" --max-results 5 \
            --query 'OperationSummaryList[].{id:Id,type:Type,status:Status,started:StartedAt,ended:EndedAt,updated:UpdatedAt}' \
            --output json 2>&1)
          operations_rc=$?
          health=$(curl -fsS --max-time 15 "$BASE_URL/health" 2>/dev/null || true)
          page=$(curl -fsSL --max-time 20 "$BASE_URL/dashboard" 2>/dev/null || true)
          marker=false
          printf '%s' "$page" | grep -Fq "This is the canonical action saved on the server" && marker=true

          body=$(printf '## AWS deploy diagnosis — PR #367\n\n- Target image tag: `%s`\n- ECR command rc: `%s`\n```json\n%s\n```\n- App Runner describe rc: `%s`\n```json\n%s\n```\n- App Runner operations rc: `%s`\n```json\n%s\n```\n- Health: `%s`\n- Canonical-preview marker live: `%s`\n' \
            "$TARGET_SHA" "$ecr_rc" "$ecr" "$service_rc" "$service" "$operations_rc" "$operations" "$health" "$marker")
          gh pr comment 367 --body "$body"
