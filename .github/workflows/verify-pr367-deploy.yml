name: Verify PR 367 production deploy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-pr367-deploy.yml"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 733bb2d2b3f41a5b928902c22dd78c7710028dd9
      BASE_URL: https://dhfgfe6yw6.eu-central-1.awsapprunner.com
      SERVICE_ARN: arn:aws:apprunner:eu-central-1:836739852304:service/laura-backend/f169c4a486cd47bfac9736ab01367a26
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::836739852304:role/GitHubActionsEcrPush
          aws-region: eu-central-1

      - name: Snapshot ECR, App Runner and live service
        shell: bash
        run: |
          set +e
          echo "=== ECR target tag ==="
          aws ecr describe-images --repository-name laura-backend \
            --image-ids imageTag="$TARGET_SHA" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt,tags:imageTags}' \
            --output json
          echo "=== App Runner service ==="
          aws apprunner describe-service --service-arn "$SERVICE_ARN" \
            --query 'Service.{status:Status,image:SourceConfiguration.ImageRepository.ImageIdentifier,auto:SourceConfiguration.AutoDeploymentsEnabled,updated:UpdatedAt,url:ServiceUrl}' \
            --output json
          echo "=== App Runner operations ==="
          aws apprunner list-operations --service-arn "$SERVICE_ARN" --max-results 5 \
            --query 'OperationSummaryList[].{id:Id,type:Type,status:Status,started:StartedAt,ended:EndedAt,updated:UpdatedAt}' \
            --output json
          echo "=== Live health ==="
          curl -fsS --max-time 15 "$BASE_URL/health" || true
          echo
          echo "=== Live dashboard marker ==="
          page=$(curl -fsSL --max-time 20 "$BASE_URL/dashboard" 2>/dev/null || true)
          if printf '%s' "$page" | grep -Fq "This is the canonical action saved on the server"; then
            echo "marker_live=true"
          else
            echo "marker_live=false"
          fi
