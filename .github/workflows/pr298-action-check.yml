name: PR298 Action Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  action-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRAIN_PROVIDER: stub
      EMBEDDING_PROVIDER: hash
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt 'pytest>=8,<10' pgserver
      - name: Focused action and Action Center tests
        run: |
          python -m pytest \
            backend/tests/test_native_runtime.py \
            backend/tests/test_approval_runtime_guard.py \
            backend/tests/test_dashboard_runtime_ui.py \
            -q -p no:cacheprovider
