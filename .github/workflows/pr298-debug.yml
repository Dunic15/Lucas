name: PR298 Debug

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr298-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-report:
    name: Capture backend failures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRAIN_PROVIDER: stub
      EMBEDDING_PROVIDER: hash
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt 'pytest>=8,<10' pgserver

      - name: Run backend tests and capture report
        run: |
          set +e
          python -m pytest backend/tests -q -p no:cacheprovider --junitxml=pytest-report.xml > pytest-output.txt 2>&1
          code=$?
          echo "$code" > pytest-exit-code.txt
          exit 0

      - name: Upload failure report
        uses: actions/upload-artifact@v4
        with:
          name: pr298-pytest-report
          path: |
            pytest-report.xml
            pytest-output.txt
            pytest-exit-code.txt

      - name: Preserve failing status
        run: test "$(cat pytest-exit-code.txt)" = "0"
