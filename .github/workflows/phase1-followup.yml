name: Phase 1 canonical preview follow-up

on:
  push:
    branches:
      - fix/phase1-canonical-preview-verification-v2
    paths:
      - scripts/phase1_followup_apply.py
      - .github/workflows/phase1-followup.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase1-canonical-preview-verification-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch and run full suite
        id: followup
        shell: bash
        run: |
          set +e
          : > phase1-followup-run.txt
          echo "Phase 1 canonical preview follow-up" >> phase1-followup-run.txt
          echo "commit=$(git rev-parse HEAD)" >> phase1-followup-run.txt

          python scripts/phase1_followup_apply.py > phase1-followup-apply.log 2>&1
          APPLY_RC=$?
          echo "apply_exit=$APPLY_RC" >> phase1-followup-run.txt
          cat phase1-followup-apply.log >> phase1-followup-run.txt

          INSTALL_RC=99
          TEST_RC=99
          if [ "$APPLY_RC" -eq 0 ]; then
            python -m pip install -r requirements.txt pytest > phase1-followup-install.log 2>&1
            INSTALL_RC=$?
            echo "install_exit=$INSTALL_RC" >> phase1-followup-run.txt
            tail -40 phase1-followup-install.log >> phase1-followup-run.txt
          fi

          if [ "$APPLY_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ]; then
            (cd backend && python -m pytest -q) > phase1-followup-tests.log 2>&1
            TEST_RC=$?
            echo "test_exit=$TEST_RC" >> phase1-followup-run.txt
            tail -120 phase1-followup-tests.log >> phase1-followup-run.txt
          fi

          echo "apply_rc=$APPLY_RC" >> "$GITHUB_OUTPUT"
          echo "install_rc=$INSTALL_RC" >> "$GITHUB_OUTPUT"
          echo "test_rc=$TEST_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit implementation and diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "${{ steps.followup.outputs.apply_rc }}" = "0" ] && [ "${{ steps.followup.outputs.install_rc }}" = "0" ] && [ "${{ steps.followup.outputs.test_rc }}" = "0" ]; then
            MSG="fix(actions): enforce canonical preview and truthful verification"
          else
            MSG="chore(actions): capture Phase 1 follow-up diagnostic"
          fi
          git commit -m "$MSG"
          git push origin HEAD:fix/phase1-canonical-preview-verification-v2

      - name: Fail on patch or test error
        if: steps.followup.outputs.apply_rc != '0' || steps.followup.outputs.install_rc != '0' || steps.followup.outputs.test_rc != '0'
        run: |
          cat phase1-followup-run.txt
          exit 1
