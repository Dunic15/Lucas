name: Petra Live Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: https://dhfgfe6yw6.eu-central-1.awsapprunner.com
      MEETING_KEY: acv-qedk-wcf
    steps:
      - name: Check production meeting archive
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body "$API_BASE/meetings" -o meetings.json
          python - <<'PY'
          import json
          data=json.load(open('meetings.json'))
          key='acv-qedk-wcf'
          print(json.dumps(data, indent=2)[:20000])
          text=json.dumps(data)
          if key not in text:
              raise SystemExit(f'meeting {key} not present in production archive yet')
          print(f'FOUND meeting {key}')
          PY
