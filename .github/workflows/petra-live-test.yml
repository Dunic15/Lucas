name: Petra Live Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: https://dhfgfe6yw6.eu-central-1.awsapprunner.com
      MEETING_KEY: acv-qedk-wcf
    steps:
      - name: Inspect production meeting archive response
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error -D headers.txt -o body.txt -w '%{http_code}' "$API_BASE/meetings")
          echo "HTTP status: $code"
          echo '--- headers ---'
          cat headers.txt
          echo '--- body preview ---'
          head -c 12000 body.txt
          echo
          echo '--- meeting match ---'
          if grep -q "$MEETING_KEY" body.txt; then
            echo "FOUND $MEETING_KEY"
          else
            echo "NOT FOUND $MEETING_KEY"
            exit 1
          fi
