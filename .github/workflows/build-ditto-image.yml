# Builda l'immagine GPU Ditto (pesi cotti dentro) e la pusha su GHCR.
# Lancio MANUALE (workflow_dispatch); l'immagine è ~12-15GB, non va buildata
# a ogni push. Il runner standard ha poco disco: il primo step lo libera.
#
# Risultato: ghcr.io/dunic15/laura-ditto:<tag>  (usalo nel template Runpod;
# per un'immagine GHCR privata serve un registry credential su Runpod).
name: build-ditto-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag immagine (es. v1)"
        required: true
        default: "v1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Libera disco (l'immagine è enorme)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: gpu
          file: gpu/Dockerfile.ditto
          push: true
          tags: ghcr.io/dunic15/laura-ditto:${{ inputs.tag }}
