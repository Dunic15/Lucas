name: Phase 1 action provenance

on:
  push:
    branches:
      - feat/phase1-action-provenance
    paths:
      - scripts/phase1_apply.py
      - .github/workflows/phase1-action-provenance.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase1-action-provenance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Phase 1 patch
        run: python scripts/phase1_apply.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run focused regression suite
        working-directory: backend
        run: >-
          pytest -q
          tests/test_phase1_action_provenance.py
          tests/test_pipedream_executor.py
          tests/test_native_executor.py
          tests/test_approve_door.py
          tests/test_dashboard.py

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/actions/action_plane.py \
            backend/app/api/org_api.py \
            frontend/dashboard.html \
            backend/app/pipedream_executor.py \
            backend/app/runtime/native_runtime.py \
            backend/app/actions/executor.py \
            backend/tests/test_phase1_action_provenance.py
          git commit -m "feat(actions): canonical preview and verified receipts"
          git push origin HEAD:feat/phase1-action-provenance
