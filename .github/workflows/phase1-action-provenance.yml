name: Phase 1 action provenance

on:
  push:
    branches:
      - feat/phase1-action-provenance
    paths:
      - scripts/phase1_apply.py
      - .github/workflows/phase1-action-provenance.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase1-action-provenance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply, test and capture result
        id: phase1
        shell: bash
        run: |
          set +e
          : > phase1-run.txt
          echo "Phase 1 action provenance run" >> phase1-run.txt
          echo "commit=$(git rev-parse HEAD)" >> phase1-run.txt

          if grep -q "def preview_for" backend/app/actions/action_plane.py && grep -q "function reviewAction" frontend/dashboard.html; then
            APPLY_RC=0
            echo "implementation already applied" > phase1-apply.log
          else
            sed -i "s/'       (opts\.approveAfter?/'      (opts.approveAfter?/g" scripts/phase1_apply.py
            python scripts/phase1_apply.py > phase1-apply.log 2>&1
            APPLY_RC=$?
          fi
          echo "apply_exit=$APPLY_RC" >> phase1-run.txt
          cat phase1-apply.log >> phase1-run.txt

          python - <<'PY'
          from pathlib import Path
          p = Path("backend/tests/test_pipedream_executor.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "    captured: dict = {}\n\n    def fake_proxy(org, acct, method, url, json_body=None, headers=None):\n        captured.update(org=org, acct=acct, method=method, url=url, body=json_body)\n",
              "    captured: dict = {\"calls\": []}\n\n    def fake_proxy(org, acct, method, url, json_body=None, headers=None):\n        captured[\"calls\"].append((method, url))\n        captured.update(org=org, acct=acct, method=method, url=url, body=json_body)\n",
              1,
          )
          s = s.replace(
              "    assert captured[\"acct\"] == \"apn_9\" and captured[\"method\"] == \"POST\"\n    assert seen[\"status\"] == \"done\" and seen[\"receipt\"][\"route\"] == \"pipedream\"\n",
              "    assert captured[\"acct\"] == \"apn_9\"\n    assert [method for method, _url in captured[\"calls\"]] == [\"POST\", \"GET\"]\n    assert out[\"verified\"] is True\n    assert seen[\"status\"] == \"done\" and seen[\"receipt\"][\"route\"] == \"pipedream\"\n    assert seen[\"receipt\"][\"verified\"] is True\n",
              1,
          )
          p.write_text(s, encoding="utf-8")
          PY

          INSTALL_RC=99
          TEST_RC=99
          if [ "$APPLY_RC" -eq 0 ]; then
            python -m pip install -r requirements.txt pytest > phase1-install.log 2>&1
            INSTALL_RC=$?
            echo "install_exit=$INSTALL_RC" >> phase1-run.txt
            tail -80 phase1-install.log >> phase1-run.txt
          fi

          if [ "$APPLY_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ]; then
            (
              cd backend && python -m pytest -q \
                tests/test_phase1_action_provenance.py \
                tests/test_pipedream_executor.py \
                tests/test_native_executor.py \
                tests/test_approve_door.py \
                tests/test_dashboard.py
            ) > phase1-tests.log 2>&1
            TEST_RC=$?
            echo "test_exit=$TEST_RC" >> phase1-run.txt
            cat phase1-tests.log >> phase1-run.txt
          fi

          echo "apply_rc=$APPLY_RC" >> "$GITHUB_OUTPUT"
          echo "install_rc=$INSTALL_RC" >> "$GITHUB_OUTPUT"
          echo "test_rc=$TEST_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit implementation and diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "${{ steps.phase1.outputs.apply_rc }}" = "0" ] && [ "${{ steps.phase1.outputs.install_rc }}" = "0" ] && [ "${{ steps.phase1.outputs.test_rc }}" = "0" ]; then
            MSG="feat(actions): canonical preview and verified receipts"
          else
            MSG="chore(actions): capture Phase 1 workflow diagnostic"
          fi
          git commit -m "$MSG"
          git push origin HEAD:feat/phase1-action-provenance

      - name: Fail when implementation or tests failed
        if: steps.phase1.outputs.apply_rc != '0' || steps.phase1.outputs.install_rc != '0' || steps.phase1.outputs.test_rc != '0'
        run: |
          cat phase1-run.txt
          exit 1
