<!--
  ANDROID — futuristic avatar page (face tier "robot"): the avatar as a
  studio-lit ANDROID bust (owner refs 2026-07-26, second round — a full
  concept switch away from the light-hologram):
    cedric  -> monochrome android: sculptural gray face inside a transparent
               glass dome with a glowing white crown panel and white SCHEMATIC
               diagrams etched on the glass; glossy black suit and neck.
    default -> (Laura, the PM avatar) white-techwear android: pale sculptural
               face, silver-gray hair, glossy white jacket, transparent VISOR
               carrying glowing orange-red HUD circuitry — a translucent band
               at eye level, an orange arc below the chin, blocks cascading
               down the neck line.
  One renderer, one THEMES table — an avatar picks its dressing by id, and
  every element is built from the avatar's own GLB (identity-safe).

  Same wire contract as /talk (the {type:"speak",text} messages, /tts payloads,
  stop / raise_hand, SSE + poll, speaking reporter, mic barge-in) — only the
  RENDERER differs.

  LAYERS:
    1. CORE MESH — the avatar's real GLB head+shoulders, clipped to a bust,
       wearing sculptural PBR materials (matte skin, glossy suit/jacket,
       themed hair). Morphs and skinning untouched — the jaw/blink still work.
    2. DOME/VISOR — a transparent ellipsoid around the head. Additive glass:
       Fresnel edge + a broad curved reflection streak, plus the theme's
       procedural TECH LAYER etched on it (schematic traces, blocks, dash-rows
       that read as text at meeting distance; band/arc/cascade on the visor).
    3. STUDIO — black void, one key light, two cool rims, soft environment
       reflections (RoomEnvironment) so the glossy surfaces read expensive.

  MOUTH — unchanged from the hologram brief: jaw opens at most ~0.14, driven
  by the /tts WORD TIMINGS; amplitude drives the tech-layer glow instead.

  STATES (calm by default — movement must MEAN something):
    idle/listening — stable, rare blink, tiny head drift, faint tech shimmer.
    thinking       — eyes drift down, the schematics scroll and flicker.
    speaking       — minimal jaw + the tech layer brightens with the voice.
    interrupted    — audio + mouth stop instantly, tech layer dips, back calm.
    raise_hand     — the tech layer pulses violet until the backend lowers it.

  TESTING (run through the backend — python3 -m http.server can't serve /tts
  or /live/act):  uvicorn app.main:app  →  http://localhost:8000/robot
    1. Android renders idle.         2. Type + "Speak" → the visor lights up.
    3. "Ask" → grounded answer.      4. 🎤 → talk, barge-in included.
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #030405; }
  /* Studio black: both refs sit in a photo-studio void — a barely-there cool
     wash behind the head, a vignette, nothing else. */
  #stage {
    position: fixed; inset: 0;
    opacity: 0; transition: opacity .45s ease;
    background:
      radial-gradient(48% 42% at 50% 34%, rgba(120,150,170,.10) 0%, rgba(120,150,170,0) 72%),
      linear-gradient(180deg, #030405 0%, #06080a 46%, #030405 100%);
  }
  #stage.live { opacity: 1; }
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,.6) 100%);
  }
  body.meeting #hud, body.meeting #status { display: none; }
  #hud {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; z-index: 10;
    font: 14px/1.4 system-ui, sans-serif;
  }
  #hud input {
    width: 320px; max-width: 60vw; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #2a2f37; background: #171b21; color: #e8ecf1;
  }
  #hud button {
    padding: 10px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: #2f6df6; color: #fff; font-weight: 600;
  }
  #hud button.alt { background: #2a2f37; }
  #status {
    position: fixed; left: 14px; top: 12px; z-index: 10; color: #9aa4b1;
    font: 12px/1.4 ui-monospace, monospace; background: #131720cc;
    padding: 6px 10px; border-radius: 8px; max-width: 70vw;
  }
</style>

<div id="stage"></div>
<div id="status">loading…</div>
<div id="hud">
  <input id="q" placeholder="Type something for the avatar to say…" />
  <button id="speakBtn">Speak</button>
  <button id="askBtn" class="alt">Ask (grounded + acts)</button>
  <button id="micBtn" class="alt" title="Talk to the avatar by voice">🎤 Talk</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

  const params = new URLSearchParams(location.search);
  const avatarId = params.get("avatar_id") || "cedric";
  const status = (t) => (document.getElementById("status").textContent = t);

  // ── scene ────────────────────────────────────────────────────────────────
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, params.get("conversation_id") ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.localClippingEnabled = true; // the bust cut (see bustPlane)
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 20);
  camera.position.set(0, 0.1, 1.4); // provisional — real framing is computed
  camera.lookAt(0, 0.1, 0);         // from the head's bounding box on load
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; // vertical framing is aspect-
    camera.updateProjectionMatrix();          // invariant, so composition holds
    renderer.setSize(innerWidth, innerHeight);
  });
  // STUDIO lighting (both refs are studio photographs): one soft key from
  // front-above, two cool rim lights that draw the glossy edges, a low fill,
  // and a room environment so PBR gloss has something real to reflect.
  scene.add(new THREE.AmbientLight(0xdfe8f0, 0.08));
  // Key from steeply above — the refs' faces are modelled by top light:
  // bright brow/nose/cheekbones, shadowed eye sockets and jaw.
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(0.1, 2.4, 1.1);
  scene.add(key);
  const rimL = new THREE.DirectionalLight(0xcfe0ee, 0.85);
  rimL.position.set(-2.2, 0.7, -1.2);
  const rimR = new THREE.DirectionalLight(0xcfe0ee, 0.85);
  rimR.position.set(2.2, 0.7, -1.2);
  scene.add(rimL, rimR);
  const fill = new THREE.DirectionalLight(0xaebecb, 0.2);
  fill.position.set(0, -1.4, 1.4);
  scene.add(fill);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();   // env texture stays alive; the generator's targets don't
  scene.environmentIntensity = 0.3;

  // BUST CUT: three planes, AND-ed by three.js — chest height plus a left and
  // right cut that remove the GLB's T-posed arms (a full-body rig has arms
  // stretched across the frame; a hologram bust must end at the shoulders).
  // Positioned once the model's real bounds are known; shared by every
  // hologram material.
  const bustPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const armPlaneL = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
  const armPlaneR = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
  const BUST_CLIP = [bustPlane, armPlaneL, armPlaneR];

  // ── THEMES: per-avatar android dressing (owner refs 2026-07-26 round 2) ──
  // cedric  = the monochrome "Robot Body" pin: gray sculpture, glass dome,
  //           white schematics, glowing crown, glossy black suit.
  // default = the white-techwear pin (Laura): pale sculpture, silver hair,
  //           glossy white jacket, orange-red HUD visor.
  const THEMES = {
    cedric: {
      mode: 0,                     // dome shader branch: white schematics
      skin: 0x565c64, skinRough: 0.62,
      hair: 0x14171b, hairRough: 0.45, hairMetal: 0.25,
      outfit: 0x0a0c0f, outfitRough: 0.2, outfitMetal: 0.7,
      bodyAsSuit: true,            // ref: the neck IS the black suit collar
      tech: 0xe6eef6,              // schematic ink: white
      accent: 0xbfd9ff,
      // A snug helmet: wider than the skull, barely taller, centred so the
      // glass ends at the jaw — the ref's dome, not an egg.
      dome: { sx: 1.48, sy: 0.9, sz: 1.48, cy: 0.16 },
    },
    default: {
      mode: 1,                     // dome shader branch: orange HUD visor
      skin: 0xe6dbd2, skinRough: 0.5,
      hair: 0xb6bac1, hairRough: 0.55, hairMetal: 0.1,   // silver-gray
      outfit: 0xdfe6ea, outfitRough: 0.32, outfitMetal: 0.05, // white jacket
      bodyAsSuit: false,           // her neck stays skin, per the ref
      hideGlasses: true,           // the ref wears no glasses — the red HUD
                                   // band across the eyes IS the eyewear
      tech: 0xff5a1c,              // HUD circuitry: orange-red
      accent: 0xff8446,
      // Her visor: a rounded shield around the face reaching below the chin
      // (the ref's cascade needs glass under the jaw), not a full egg.
      dome: { sx: 1.42, sy: 1.12, sz: 1.42, cy: -0.04 },
    },
  };
  // Own-property lookup on a lowercased id: the query string could carry
  // "constructor" (prototype pollution -> theme is a function) or "Cedric"
  // (case-sensitive miss -> silently the wrong dressing).
  const themeId = avatarId.toLowerCase();
  const theme = Object.hasOwn(THEMES, themeId) ? THEMES[themeId] : THEMES.default;
  const VIOLET = new THREE.Color(0xa86eff);   // hand-raise pulse tint
  const _tint = new THREE.Color();            // per-frame scratch (no GC churn)

  // Live uniforms the state machine drives every frame.
  const techU = {
    uTime: { value: 0 },
    uBoost: { value: 0.7 },                       // tech-layer brightness
    uTech: { value: new THREE.Color(theme.tech) },// current ink colour
    uMode: { value: theme.mode },
    uEyeV: { value: 0.0 },                        // eye line in dome-local V
  };

  // Sculptural PBR — the refs are studio renders, not glowing holograms.
  function surfaceMaterial({ color, roughness = 0.5, metalness = 0.0,
                             envMapIntensity = 0.6, map = null,
                             emissive = 0x000000, emissiveIntensity = 0 } = {}) {
    const m = new THREE.MeshStandardMaterial({
      color, roughness, metalness, emissive, emissiveIntensity,
      clippingPlanes: BUST_CLIP, clipShadows: false,
    });
    m.envMapIntensity = envMapIntensity;
    if (map) m.map = map;
    return m;
  }

  // GLASS DOME / VISOR — additive, so it always reads as light ON glass and
  // never darkens the face behind it. Local coords are the unit sphere; the
  // front hemisphere is projected to a plane for the tech layer.
  function domeMaterial() {
    return new THREE.ShaderMaterial({
      uniforms: techU,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      side: THREE.FrontSide,
      vertexShader: `
        varying vec3 vP;      // unit-sphere local position
        varying vec3 vN, vV;
        void main() {
          vP = position;
          vN = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vV = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform float uTime, uBoost, uMode, uEyeV;
        uniform vec3 uTech;
        varying vec3 vP; varying vec3 vN, vV;
        float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        // One schematic cell: per-cell hash picks trace / block / text-dashes
        // / node dot. At meeting distance this reads as engineering etchings.
        float schem(vec2 uv, float t) {
          vec2 g = uv * vec2(26.0, 34.0);
          vec2 id = floor(g); vec2 f = fract(g);
          float h = h21(id);
          float flick = 0.8 + 0.2 * sin(t * (0.4 + h * 2.6) + h * 40.0);
          float a = 0.0;
          if (h > 0.93) {                       // rectangle block, hollow
            float outer = step(0.12, f.x) * step(f.x, 0.88) * step(0.18, f.y) * step(f.y, 0.82);
            float inner = step(0.3, f.x) * step(f.x, 0.7) * step(0.34, f.y) * step(f.y, 0.66);
            a = outer - inner * 0.75;
          } else if (h > 0.84) {                // horizontal trace + node
            a = step(abs(f.y - 0.5), 0.055) * step(0.06, f.x) * step(f.x, 0.94);
            a += smoothstep(0.13, 0.04, length(f - vec2(0.88, 0.5)));
          } else if (h > 0.76) {                // vertical trace
            a = step(abs(f.x - 0.5), 0.055) * step(0.08, f.y) * step(f.y, 0.92);
          } else if (h > 0.62) {                // text: a row of ragged dashes
            float seg = floor(f.x * 6.0);
            float hs = h21(id + seg + 7.0);
            a = step(abs(f.y - 0.5), 0.1) * step(0.12, fract(f.x * 6.0))
              * step(fract(f.x * 6.0), 0.82) * step(0.3, hs);
          } else if (h > 0.56) {                // lone node dot
            a = smoothstep(0.09, 0.03, length(f - 0.5));
          }
          return a * flick;
        }
        void main() {
          vec3 n = normalize(vN); vec3 v = normalize(vV);
          float fres = pow(1.0 - abs(dot(n, v)), 3.0);
          // Broad curved reflection streak, upper-left — the studio softbox.
          float streak = pow(max(dot(normalize(vP), normalize(vec3(-0.45, 0.85, 0.5))), 0.0), 5.0);
          // Front-hemisphere planar projection for the tech layer.
          vec3 p = normalize(vP);
          vec2 uv = p.xy / (p.z + 1.15);
          float tech = 0.0; float techFill = 0.0;
          if (uMode < 0.5) {
            // CEDRIC: schematic side-panels left+right of the face centre
            // (the ref keeps the nose line clean), plus the white CROWN cap.
            float sides = smoothstep(0.08, 0.16, abs(uv.x)) * smoothstep(0.72, 0.5, abs(uv.x));
            float band = smoothstep(-0.5, -0.36, uv.y) * smoothstep(0.5, 0.34, uv.y);
            float front = smoothstep(0.05, 0.35, p.z);
            tech = schem(uv * vec2(1.6, 1.9), uTime * 0.4) * sides * band * front * 1.25;
            float crown = smoothstep(0.4, 0.62, p.y) * smoothstep(-0.45, 0.05, p.z);
            techFill = crown * 1.6;             // the glowing crown panel
          } else {
            // LAURA: red-orange HUD — translucent eye band, orange arc under
            // the chin, dense blocks cascading down the neck line.
            float front = smoothstep(0.1, 0.4, p.z);
            float bandM = smoothstep(0.13, 0.05, abs(p.y - uEyeV)) * front;
            techFill += bandM * 0.85;                        // translucent mask
            tech += schem(uv * vec2(2.2, 2.8) + 31.7, uTime * 0.5) * bandM * 2.3;
            float arcY = uEyeV - 0.4;
            float r = length(vec2(uv.x * 1.35, (p.y - arcY) * 1.45));
            float arc = smoothstep(0.05, 0.015, abs(r - 0.4)) * step(p.y, arcY + 0.08) * front;
            tech += arc * 1.6;                               // the orange arc
            float cascade = smoothstep(0.26, 0.1, abs(uv.x)) * smoothstep(uEyeV - 0.16, uEyeV - 0.5, p.y) * front;
            tech += schem(uv * vec2(2.6, 3.2) + vec2(0.0, uTime * 0.045) + 57.3, uTime * 0.5) * cascade * 1.9;
            float sparse = smoothstep(0.2, 0.5, abs(uv.x)) * front;
            tech += schem(uv * vec2(1.4, 1.8) + 11.9, uTime * 0.3) * sparse * 0.35;
          }
          vec3 glass = vec3(0.75, 0.85, 0.95) * (fres * 0.32 + streak * 0.16);
          vec3 ink = uTech * (tech * 0.95 + techFill) * uBoost;
          float alpha = clamp(fres * 0.5 + streak * 0.3 + (tech + techFill) * 0.85, 0.0, 1.0);
          gl_FragColor = vec4(glass + ink, alpha);
        }`,
    });
  }


  // ── the android ──────────────────────────────────────────────────────────
  const holo = new THREE.Group();
  scene.add(holo);

  let model = null, dome = null;
  const morphMeshes = [];
  const morphKey = (dict, names) => names.find((n) => dict[n] !== undefined);
  (async () => {
    try {
      if (!/^[a-z0-9_-]+$/i.test(avatarId)) throw new Error("bad avatar id");
      const gltf = await new GLTFLoader().loadAsync(`/${avatarId}.glb`);
      model = gltf.scene;

      // Which meshes make the BUST. Teeth/tongue are dropped outright (the
      // brief's "no visible teeth" — and additive teeth glow through lips).
      // The body + top give real shoulders; the clipping plane cuts the chest.
      const DROP = /teeth|tooth|tongue|shoe|footwear|bottom|pant|trouser/i;
      // Both GLB naming conventions in this repo: cedric.glb (Avatar*Eyeball)
      // and Ready Player Me / Wolf3D exports (EyeLeft/EyeRight, petra.glb).
      // The lookahead keeps eyelash/eyebrow meshes out of the bright-eye branch.
      const EYE = /eyeball|cornea|iris|eye(?!lash|brow)/i;
      // Hair classified separately so each theme can dress it (silver on
      // her, near-black gloss on him).
      const HAIR = /hair|beard/i;
      const HEAD = /head|eyelash|brow/i;
      const meshes = [];
      model.traverse((o) => { if (o.isMesh || o.isSkinnedMesh) meshes.push(o); });
      const kept = [];
      for (const o of meshes) {
        if (DROP.test(o.name)
            || (theme.hideGlasses && /glass|spectacle|eyewear/i.test(o.name))) {
          o.visible = false; continue;
        }
        o.visible = true;
        o.frustumCulled = false;
        o.renderOrder = 0; // core mesh draws first and writes depth
        const origMap = o.material && o.material.map;
        // Underscores are stripped BEFORE the test, so the pattern must not
        // contain one ("Wolf3D_Body" -> "Wolf3DBody"); the fallback uses
        // (^|_) boundaries because _ is a word character and defeats \b.
        const isBodySkin = /^(wolf3d)?(avatar)?body$/i.test(o.name.replace(/_/g, ""))
          || /(^|_)body(_|$)/i.test(o.name);
        if (EYE.test(o.name)) {
          // EYES: keep the GLB's own texture (iris + pupil at the rig's real
          // UVs) with a whisper of emissive so they stay alive under studio
          // light — natural, not glowing: both refs have human eyes.
          o.material = surfaceMaterial({ color: 0xffffff, roughness: 0.25,
            envMapIntensity: 0.8, map: origMap,
            emissive: 0x202830, emissiveIntensity: origMap ? 0.35 : 0.0 });
          o.renderOrder = 1;
        } else if (/eyelash/i.test(o.name)) {
          o.material = surfaceMaterial({ color: 0x14161a, roughness: 0.8,
            envMapIntensity: 0.1 });
        } else if (HAIR.test(o.name)) {
          // Theme hair: silver-gray on her (the ref's bangs), near-black
          // gloss on him (the ref is helmeted — dark keeps it quiet).
          o.material = surfaceMaterial({ color: theme.hair,
            roughness: theme.hairRough, metalness: theme.hairMetal,
            envMapIntensity: 0.7 });
        } else if (HEAD.test(o.name) || (isBodySkin && !theme.bodyAsSuit)) {
          // FACE (and, on her, the neck): sculptural monochrome skin — no
          // texture map on purpose; both refs are desaturated sculpture, and
          // the studio lights do the modelling.
          o.material = surfaceMaterial({ color: theme.skin,
            roughness: theme.skinRough, envMapIntensity: 0.12 });
        } else {
          // Suit / jacket (and, on him, the neck: the ref's black collar
          // rises to the jaw): glossy themed shell.
          o.material = surfaceMaterial({ color: theme.outfit,
            roughness: theme.outfitRough, metalness: theme.outfitMetal,
            envMapIntensity: 0.9 });
        }
        kept.push(o);
        const dict = o.morphTargetDictionary;
        if (dict && o.morphTargetInfluences) {
          const grab = (names) => { const k = morphKey(dict, names); return k === undefined ? null : dict[k]; };
          const rec = {
            infl: o.morphTargetInfluences,
            jaw: grab(["jawOpen", "JawOpen", "mouthOpen"]),
            funnel: grab(["mouthFunnel", "mouthPucker"]),
            blinkL: grab(["eyeBlinkLeft", "EyeBlinkLeft", "eyesClosed"]),
            blinkR: grab(["eyeBlinkRight", "EyeBlinkRight"]),
            lookDnL: grab(["eyeLookDownLeft"]),
            lookDnR: grab(["eyeLookDownRight"]),
          };
          if (rec.jaw !== null || rec.blinkL !== null) morphMeshes.push(rec);
        }
      }

      // ── auto-framing from the HEAD's real bounds (no magic cam_z) ────────
      // Face ≈ 62% of viewport height, eye line above centre, emitter visible
      // below the bust. ?cam_z/?cam_y/?cam_ty remain A/B overrides.
      model.updateMatrixWorld(true);
      // Measure the FACE, not the head mesh: on this rig AvatarHead includes
      // the neck, so its bbox height would under-scale the face on screen.
      // The eyeballs give a true eye line; crown-to-eyes is ~45% of a human
      // face, which yields the real face height on any humanoid GLB.
      const headBox = new THREE.Box3();
      for (const o of kept) if (HEAD.test(o.name) || HAIR.test(o.name) || EYE.test(o.name)) headBox.expandByObject(o);
      if (headBox.isEmpty()) for (const o of kept) headBox.expandByObject(o);
      const eyeMeshes = kept.filter((o) => EYE.test(o.name));
      const eyeBox = new THREE.Box3();
      for (const o of eyeMeshes) eyeBox.expandByObject(o);
      const crownY = headBox.max.y;
      const eyeWorldY = eyeBox.isEmpty()
        ? crownY - (headBox.max.y - headBox.min.y) * 0.34
        : eyeBox.getCenter(new THREE.Vector3()).y;
      const faceH = Math.max(1e-4, (crownY - eyeWorldY) / 0.45);
      const center = headBox.getCenter(new THREE.Vector3());
      model.position.x -= center.x;
      model.position.y -= eyeWorldY;         // EYE LINE at y = 0
      holo.add(model);
      model.updateMatrixWorld(true);

      // ── GLASS DOME / VISOR: an ellipsoid around the measured head ────────
      // Sized from the head's real bounds so any humanoid GLB gets the same
      // composition. Cedric's dome envelops the skull (helmet); Laura's visor
      // is taller and sits lower, reaching below the chin for the cascade.
      {
        const hw = (headBox.max.x - headBox.min.x) / 2;
        const hh = (headBox.max.y - headBox.min.y) / 2;
        const hd = (headBox.max.z - headBox.min.z) / 2;
        // headBox was measured pre-shift; the model moved by (-center.x,
        // -eyeWorldY), so the head centre lands at:
        const hcY = center.y - eyeWorldY + theme.dome.cy * faceH;
        const hcZ = center.z;
        dome = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 72), domeMaterial());
        dome.scale.set(hw * theme.dome.sx, hh * theme.dome.sy, hd * theme.dome.sz);
        dome.position.set(0, hcY, hcZ);
        dome.renderOrder = 6;                // after every opaque surface
        dome.frustumCulled = false;
        holo.add(dome);
        // Eye line (world y = 0) in the dome's local unit-sphere V. The
        // -0.12 nudge accounts for the stereographic projection reading a
        // touch high on the sphere's front face (calibrated on render).
        techU.uEyeV.value = (0 - hcY) / (hh * theme.dome.sy) - 0.12;
      }

      // Face fills ~62% of frame height; the eye line sits above centre. The
      // dome adds visual height, so FILL is a touch looser than /talk's so
      // the glass crown stays in frame.
      const FILL = 0.55;
      const visibleH = faceH / FILL;
      const lookY = -visibleH * 0.21;        // aim low → subject sits high
      const dist = visibleH / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
      const camP = (k, d) => { const v = parseFloat(params.get(k)); return Number.isNaN(v) ? d : v; };
      camera.position.set(0, camP("cam_y", 0), camP("cam_z", dist));
      camera.lookAt(0, camP("cam_ty", lookY), 0);

      // Bust cut at the shoulder line; arms cut just outside the shoulders.
      const cutY = -visibleH * 0.55;
      bustPlane.constant = -cutY;            // keep y > cutY
      const halfW = faceH * 0.8;             // keep |x| < halfW (arms gone)
      armPlaneL.constant = halfW;
      armPlaneR.constant = halfW;

      status("live — android rendering ✅ (type + Speak, or 🎤 Talk)");
    } catch (e) {
      status("android: model unavailable (" + (e?.message || e) + ")");
      console.error(e);
    }
  })();

  // ── visual state machine — calm is the default ───────────────────────────
  let handRaised = false;
  let interruptedAt = -1e9;   // ms domain (performance.now()); never "just interrupted" at boot
  // Speech state — declared BEFORE animate() starts, which reads it per frame.
  let _sayChain = Promise.resolve();
  let _sayGen = 0;
  let _pendingSay = 0;
  let activeSource = null;
  let speakingUntil = 0;
  let herText = "";       // normalized words he's currently saying (echo filter)
  let _askController = null;
  let _thinking = false;

  // Mood tints the TECH INK only (never the face): the theme colour is the
  // baseline; concerned warms it, serious cools it.
  const MOOD_ACCENT = { neutral: theme.tech, happy: theme.tech,
                        excited: theme.accent, serious: 0xbcd4ff,
                        concerned: 0xffb347 };
  let accent = new THREE.Color(theme.tech);
  function setMood(label) {
    accent = new THREE.Color(MOOD_ACCENT[label || "neutral"] ?? theme.tech);
  }

  // Mouth: word-timing track set by playAudio, read by animate().
  let mouthTrack = null;
  let jawLevel = 0, funnelLevel = 0, eyesDown = 0;
  let nextBlink = 1.5, blinkT = -1;
  let nextNod = 7, nodT = -1;
  const wordHash = (w) => { let h = 0; for (const c of w) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0) / 4294967295; };
  // Mouth stays MINIMAL on purpose: enough to read as speech, never enough to
  // read as broken lip-sync.
  const JAW_MAX = 0.14;

  let analyser = null, freq = null;
  const clock = new THREE.Clock();
  let revealed = false;
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const nowMs = performance.now();
    const speakingNow = !!activeSource || _pendingSay > 0;
    const justInterrupted = (nowMs - interruptedAt) < 450;

    // Voice energy 0..1 — drives glow/particles/emitter, never mouth shape.
    let level = 0;
    if (analyser && speakingNow) {
      analyser.getByteFrequencyData(freq);
      for (let i = 1; i < 8; i++) level = Math.max(level, (freq[i] || 0) / 255);
    }

    // Presence: a slow float and a barely-there drift. Calm is the baseline.
    holo.position.y = Math.sin(t * 0.8) * 0.010;
    if (model) model.rotation.y = Math.sin(t * 0.22) * 0.035;

    // ── minimal mouth, driven by word timings when we have them ──────────
    let jawTarget = 0, funnelTarget = 0;
    if (mouthTrack && speakingNow) {
      const e = nowMs - mouthTrack.t0;
      const { words, wtimes, wdurations } = mouthTrack;
      for (let i = 0; i < wtimes.length; i++) {
        const s = wtimes[i], d = Math.max(wdurations?.[i] || 120, 60);
        if (e >= s && e <= s + d) {
          const env = Math.sin(Math.PI * Math.min((e - s) / d, 1));
          jawTarget = env * JAW_MAX * (0.75 + 0.5 * level);
          funnelTarget = env * wordHash(words?.[i] || "") * 0.22;
          break;
        }
      }
    } else if (speakingNow) {
      jawTarget = level * JAW_MAX;            // fallback: amplitude only
    }
    jawLevel += (jawTarget - jawLevel) * 0.35;
    funnelLevel += (funnelTarget - funnelLevel) * 0.25;

    // Blinks: always independent of speech.
    let blink = 0;
    if (blinkT < 0 && t > nextBlink) { blinkT = t; nextBlink = t + 2.6 + Math.random() * 3.6; }
    if (blinkT >= 0) {
      const p = (t - blinkT) / 0.15;
      blink = p >= 1 ? 0 : 1 - Math.abs(1 - 2 * Math.min(p, 1));
      if (p >= 1) blinkT = -1;
    }
    // Thinking: the eyes drift down while a request is in flight.
    eyesDown += ((_thinking ? 0.32 : 0) - eyesDown) * 0.07;
    for (const m of morphMeshes) {
      if (m.jaw !== null) m.infl[m.jaw] = jawLevel;
      if (m.funnel !== null) m.infl[m.funnel] = funnelLevel;
      if (m.blinkL !== null) m.infl[m.blinkL] = blink;
      if (m.blinkR !== null) m.infl[m.blinkR] = blink;
      if (m.lookDnL !== null) m.infl[m.lookDnL] = eyesDown;
      if (m.lookDnR !== null) m.infl[m.lookDnR] = eyesDown;
    }
    // A rare idle nod — presence, not fidgeting.
    if (nodT < 0 && !speakingNow && t > nextNod) { nodT = t; nextNod = t + 11 + Math.random() * 9; }
    if (nodT >= 0 && model) {
      const p = (t - nodT) / 0.75;
      model.rotation.x = p >= 1 ? 0 : Math.sin(Math.PI * Math.min(p, 1)) * 0.04;
      if (p >= 1) nodT = -1;
    }

    // ── energy: the tech layer reacts, the face never does ───────────────
    const pulse = handRaised ? 0.5 + 0.5 * Math.sin(t * 6) : 0;
    _tint.set(theme.tech).lerp(accent, 0.65).lerp(VIOLET, pulse);
    techU.uTime.value = t;
    techU.uTech.value.copy(_tint);
    // The etchings breathe at rest, brighten with the voice and while
    // thinking, dip on interrupt, and pulse on hand-raise.
    const breath = 0.06 * Math.sin(t * 0.9);
    techU.uBoost.value = (justInterrupted ? 0.35 : 1.0)
      * (0.72 + breath + level * 0.75 + (_thinking ? 0.35 : 0) + pulse * 0.5);

    renderer.render(scene, camera);
    if (!revealed) { revealed = true; stage.classList.add("live"); }
  }
  animate();
  window.__robot = { holo, get model() { return model; }, morphMeshes, techU, theme,
                     get dome() { return dome; },
                     ctx: () => ctx(), get analyser() { return analyser; } };

  // ── audio: same /tts contract as talk.html, played through an analyser ───
  let _ctx = null;
  function ctx() {
    if (!_ctx) {
      _ctx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = _ctx.createAnalyser();
      analyser.fftSize = 64;
      analyser.smoothingTimeConstant = 0.5;
      freq = new Uint8Array(analyser.frequencyBinCount);
      analyser.connect(_ctx.destination);
    }
    return _ctx;
  }
  const unlockAudio = () => { try { ctx().resume(); } catch (_) {} };
  document.addEventListener("pointerdown", unlockAudio, { once: true });
  document.addEventListener("keydown", unlockAudio, { once: true });

  // Decode a TTS payload keeping the WORD TIMINGS — they drive the mouth.
  async function payloadToAudio(j, text) {
    const bin = Uint8Array.from(atob(j.audio), (c) => c.charCodeAt(0));
    const buffer = await ctx().decodeAudioData(bin.buffer);
    let { words, wtimes, wdurations } = j;
    if (!words || !words.length) {
      // No alignment (fallback TTS): spread words evenly — approximate, but
      // the mouth still moves per word instead of buzzing on amplitude.
      words = (text || "").trim().split(/\s+/).filter(Boolean);
      const per = (buffer.duration * 1000) / Math.max(words.length, 1);
      wtimes = words.map((_, i) => Math.round(i * per));
      wdurations = words.map(() => Math.round(per * 0.85));
    }
    return { buffer, words, wtimes, wdurations };
  }
  async function synthesize(text) {
    const r = await fetch("/tts", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, avatar_id: avatarId }),
    });
    if (!r.ok) throw new Error("/tts not available yet (" + r.status + ")");
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return payloadToAudio(j, text);
  }

  // Pipelined speech, same scheme as talk.html: synthesis starts the moment a
  // sentence arrives, playback stays strictly in arrival order, and a bumped
  // generation drops anything queued before an interrupt.
  const _norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  function playAudio(a, text) {
    return new Promise((resolve) => {
      const src = ctx().createBufferSource();
      src.buffer = a.buffer;
      src.connect(analyser);
      activeSource = src;
      mouthTrack = { t0: performance.now(), words: a.words, wtimes: a.wtimes, wdurations: a.wdurations };
      speakingUntil = Math.max(speakingUntil, performance.now()) + a.buffer.duration * 1000 + 300;
      herText = _norm(text);
      src.onended = () => { if (activeSource === src) { activeSource = null; mouthTrack = null; } resolve(); };
      src.start();
    });
  }
  function interruptSpeech() {
    _sayGen++;
    _sayChain = Promise.resolve();
    if (activeSource) { try { activeSource.stop(); } catch (_) {} activeSource = null; }
    if (_askController) { try { _askController.abort(); } catch (_) {} }
    _thinking = false;
    mouthTrack = null;                 // mouth to neutral NOW, no trailing words
    interruptedAt = performance.now(); // shell contracts (see animate)
    speakingUntil = 0;
    herText = "";
    status("(interrupted — listening)");
  }
  window.interruptSpeech = interruptSpeech;
  function say(text, pre) {
    if (!text || !text.trim()) return _sayChain;
    unlockAudio();
    const synth = pre && pre.audio ? payloadToAudio(pre, text) : synthesize(text);
    const mood = (pre && pre.emotion) || "neutral";
    const gen = _sayGen;
    _pendingSay++;
    _sayChain = _sayChain.then(async () => {
      try {
        const a = await synth;
        if (gen !== _sayGen) return; // interrupted while synthesizing — drop it
        setMood(mood);
        status("speaking: " + text.slice(0, 60));
        await playAudio(a, text);
      } catch (e) {
        status("speak failed: " + (e?.message || e));
        console.error(e);
      } finally {
        _pendingSay = Math.max(0, _pendingSay - 1);
      }
    });
    return _sayChain;
  }
  window.speak = say;

  // ── grounded answer that can ACT: /live/act SSE, spoken chunk by chunk ───
  async function ask(question) {
    interruptSpeech();
    status("thinking…");
    const ctrl = new AbortController();
    _askController = ctrl;
    _thinking = true;
    const genAtStart = _sayGen;
    let r;
    try {
      r = await fetch("/live/act", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ avatar_id: avatarId, question }),
        signal: ctrl.signal,
      });
    } catch (e) {
      if (ctrl === _askController) _thinking = false;
      if (e && e.name === "AbortError") return;
      status("ask failed: " + (e?.message || e));
      return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", saidAny = false;
    try {
      for (;;) {
        const { done, value } = await reader.read();
        if (done || ctrl.signal.aborted || _sayGen !== genAtStart) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n\n")) >= 0) {
          const evt = buf.slice(0, nl); buf = buf.slice(nl + 2);
          const m = evt.match(/^data: (\{.*\})$/m);
          if (!m) continue;
          let content; try { content = JSON.parse(m[1]).content; } catch { continue; }
          if (content && !ctrl.signal.aborted && _sayGen === genAtStart) { say(content); saidAny = true; }
        }
      }
    } catch (e) { if (!(e && e.name === "AbortError")) console.error(e); }
    if (ctrl === _askController) _thinking = false;
    if (!saidAny && !ctrl.signal.aborted) status("(stayed silent)");
  }

  document.getElementById("speakBtn").onclick = () => say(document.getElementById("q").value);
  document.getElementById("askBtn").onclick = () => ask(document.getElementById("q").value);

  // ── voice input: same mic/echo/stop-word engine as talk.html ─────────────
  const micBtn = document.getElementById("micBtn");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micOn = false, rec = null;
  function looksLikeEcho(heard) {
    const words = _norm(heard).split(" ").filter(Boolean);
    if (!words.length) return true;
    const his = new Set(herText.split(" ").filter(Boolean));
    if (!his.size) return false;
    return words.filter((w) => his.has(w)).length / words.length >= 0.5;
  }
  const STOP_PHRASES = ["give me a second", "give me a moment", "give me a minute", "give me a sec", "that s enough", "stop talking", "one second", "one moment", "one minute", "never mind", "nevermind", "forget it", "be quiet", "hold on", "hang on", "shut up", "stop it", "one sec",
    "lascia stare", "lascia perdere", "non importa", "basta cos", "un attimo", "un secondo", "un momento"].sort((a, b) => b.length - a.length);
  const STOP_WORDS = new Set(["stop", "wait", "pause", "quiet", "silence", "enough", "hush", "shush",
    "aspetta", "fermati", "ferma", "zitto", "zitta", "basta", "taci", "silenzio", "smettila"]);
  // Avatar names (and their common ASR misspellings, mirroring the wake_words
  // in the avatar.yaml files) count as polite filler in a stop command, so
  // "Laura, stop" or "ok Cedric, hold on" barge in for EVERY robot-tier avatar.
  const POLITE_WORDS = new Set(["ok", "okay", "no", "hey", "please", "now", "just", "a", "one", "sec", "second", "moment", "minute", "thanks", "thank", "you",
    "cedric", "cedrick", "sedric", "sedrik", "sedrick", "laura", "lara", "lora", "petra",
    "per", "favore", "grazie", "un", "attimo", "secondo", "momento", "ora", "adesso", "ehi", "dai"]);
  POLITE_WORDS.add(avatarId.toLowerCase());
  function stopWordIn(h) {
    for (const p of STOP_PHRASES) if (h.includes(p)) return p;
    for (const w of h.split(" ")) if (STOP_WORDS.has(w)) return w;
    return null;
  }
  function containsStopWord(heard) {
    const w = stopWordIn(_norm(heard));
    return !!w && !herText.includes(w);
  }
  function isStopCommand(heard) {
    let h = _norm(heard);
    if (!h || !containsStopWord(heard)) return false;
    for (const p of STOP_PHRASES) h = h.split(p).join(" ");
    return h.split(" ").filter(Boolean).every((w) => STOP_WORDS.has(w) || POLITE_WORDS.has(w));
  }
  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = "Voice input needs Chrome/Edge (Web Speech API)";
  } else {
    rec = new SR();
    rec.lang = "en-US";
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (ev) => {
      const res = ev.results[ev.results.length - 1];
      const heard = (res[0] && res[0].transcript || "").trim();
      if (!heard) return;
      const heSpeaking = performance.now() < speakingUntil || !!activeSource;
      if ((heSpeaking || _thinking) && isStopCommand(heard)) {
        interruptSpeech();
        status("(stopped — listening)");
        return;
      }
      if (heSpeaking && looksLikeEcho(heard)) {
        if (containsStopWord(heard)) interruptSpeech();
        return;
      }
      if (heSpeaking) interruptSpeech();
      if (!res.isFinal) { status("hearing: " + heard); return; }
      if (isStopCommand(heard)) { status("(listening)"); return; }
      document.getElementById("q").value = heard;
      status("heard: " + heard);
      ask(heard);
    };
    rec.onend = () => { if (micOn) { try { rec.start(); } catch (_) {} } };
    rec.onerror = (e) => {
      if (e.error === "not-allowed") { micOn = false; micBtn.textContent = "🎤 Talk"; status("mic blocked — allow microphone access"); }
    };
    micBtn.onclick = () => {
      micOn = !micOn;
      if (micOn) {
        try { rec.start(); } catch (_) {}
        micBtn.textContent = "🔴 Listening…";
        micBtn.style.background = "#c0392b";
        status("listening — talk to him (say 'wait' to cut him off)");
      } else {
        try { rec.stop(); } catch (_) {}
        micBtn.textContent = "🎤 Talk";
        micBtn.style.background = "";
        status("mic off");
      }
    };
  }

  // ── Meeting mode: byte-compatible with talk.html's backend contract ──────
  const conversationId = params.get("conversation_id");
  if (conversationId) {
    document.body.classList.add("meeting");
    unlockAudio(); // the Recall bot browser never clicks

    let staleBefore = -Infinity;
    const genOf = (msg) => {
      const g = msg.generation_id ?? msg.speech_generation_id ?? msg.generation;
      return typeof g === "number" ? g : null;
    };
    const handleBackendMessage = (msg) => {
      if (!msg) return;
      if (msg.type === "speak" && msg.text) {
        const g = genOf(msg);
        if (g !== null && g <= staleBefore) return; // superseded by a stop
        unlockAudio(); say(msg.text, msg);
      } else if (msg.type === "stop") {
        const g = genOf(msg);
        if (g !== null) staleBefore = Math.max(staleBefore, g);
        interruptSpeech();
      } else if (msg.type === "raise_hand") {
        handRaised = true;
      } else if (msg.type === "lower_hand") {
        handRaised = false;
      }
    };

    // Path 1: SSE push (App Runner 403s WebSockets, streams SSE fine).
    const es = new EventSource(`/avatar/stream/${encodeURIComponent(conversationId)}`);
    es.onmessage = (ev) => {
      try { handleBackendMessage(JSON.parse(ev.data)); } catch (_) { /* non-JSON */ }
    };
    // Path 2: slow poll as belt-and-braces; both drain the same queue.
    const poll = async () => {
      try {
        const r = await fetch(`/avatar/messages/${encodeURIComponent(conversationId)}`,
                              { cache: "no-store" });
        if (r.ok) {
          const data = await r.json();
          for (const msg of data.messages || []) handleBackendMessage(msg);
        }
      } catch (_) { /* keep polling */ }
      setTimeout(poll, 2000);
    };
    poll();

    // Report the REAL speaking state (same scheme as talk.html): heartbeat
    // while anything is playing or queued, one false on the transition.
    let reportedSpeaking = false;
    setInterval(() => {
      const speaking = _pendingSay > 0 || !!activeSource || performance.now() < speakingUntil;
      if (!speaking && !reportedSpeaking) return;
      reportedSpeaking = speaking;
      fetch(`/avatar/speaking/${encodeURIComponent(conversationId)}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ speaking }),
      }).catch(() => {});
    }, 700);
  }
</script>
