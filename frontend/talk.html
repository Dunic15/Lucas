<!--
  Laura — open-source avatar page (Anam replacement, Stage 1).

  Runs ENTIRELY in the browser: TalkingHead (3D avatar, Three.js/WebGL) renders a
  Ready Player Me character and lip-syncs to audio we feed it. No Anam, no GPU
  server. Recall's web_gpu bot renders this page as the meeting camera.

  Pipeline (arrows written as -> on purpose: a dash-dash-gt sequence closes a comment):
    meeting question -> (backend transcript) -> we call /live/ask (RAG + Groq)
      -> answer text -> TTS (audio) -> head.speakAudio(...) -> lip-synced speech
      -> Recall captures this page's canvas+audio -> streamed into the meeting

  TESTING STAGES (open this file via the backend, e.g. http://localhost:8000/talk):
    1. Avatar RENDERS (idle: breathing, blinking).            [no backend TTS needed]
    2. Type text + "Speak"  -> she lip-syncs it.               [needs /tts endpoint]
    3. Ask a question       -> she pulls a grounded answer.    [needs /tts + /live/ask]

  The model is /laura.glb — an HD photorealistic avatar vendored into this repo
  (Ready Player Me shut down Jan 2026, so we self-host). To try another model:
  ?avatar_url=<glb-url> (needs ARKit + Oculus viseme morph targets). Sources:
  Avaturn or MetaPerson/AvatarSDK exports are compatible.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0d1014; }
  #stage { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; z-index: 10;
    font: 14px/1.4 system-ui, sans-serif;
  }
  #hud input {
    width: 320px; max-width: 60vw; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #2a2f37; background: #171b21; color: #e8ecf1;
  }
  #hud button {
    padding: 10px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: #2f6df6; color: #fff; font-weight: 600;
  }
  #hud button.alt { background: #2a2f37; }
  #status {
    position: fixed; left: 14px; top: 12px; z-index: 10; color: #9aa4b1;
    font: 12px/1.4 ui-monospace, monospace; background: #131720cc;
    padding: 6px 10px; border-radius: 8px; max-width: 70vw;
  }
</style>

<div id="stage"></div>
<div id="status">loading…</div>
<div id="hud">
  <input id="q" placeholder="Type something for Laura to say…" />
  <button id="speakBtn">Speak</button>
  <button id="askBtn" class="alt">Ask (grounded + acts)</button>
  <button id="micBtn" class="alt" title="Talk to Laura by voice">🎤 Talk</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.1.7/+esm",
    "marked": "https://cdn.jsdelivr.net/npm/marked@14.1.3/+esm",
    "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.4/modules/talkinghead.mjs"
  }
}
</script>

<script type="module">
  import { TalkingHead } from "talkinghead";

  const params = new URLSearchParams(location.search);

  // HD photorealistic model (Avaturn sample from the TalkingHead repo), vendored
  // into OUR repo and served same-origin: Ready Player Me's CDN shutdown
  // (Jan 2026) killed the previous third-party URL — never again. Override for
  // A/B tests with ?avatar_url=<glb url> (must have ARKit+Oculus viseme morphs).
  const AVATAR_URL = params.get("avatar_url") || "/laura.glb";
  const avatarId = params.get("avatar_id") || "laura";
  const status = (t) => (document.getElementById("status").textContent = t);

  const head = new TalkingHead(document.getElementById("stage"), {
    // TalkingHead's constructor THROWS if ttsEndpoint is missing — even though we
    // never call speakText(). We drive audio ourselves via speakAudio() with our own
    // free /tts, so this is a harmless dummy that is never actually fetched. (Without
    // it, the constructor throws at load and the whole page dies: no avatar, dead HUD.)
    ttsEndpoint: "/gtts-unused",
    lipsyncModules: ["en"],
    cameraView: "upper",
    cameraDistance: 0,
    avatarMood: "neutral",
    modelPixelRatio: 1,
  });

  try {
    status("loading avatar…");
    await head.showAvatar({ url: AVATAR_URL, body: "F", lipsyncLang: "en" });
    head.start();
    status("live — avatar rendering ✅ (type + Speak to test lip-sync)");
  } catch (e) {
    status("avatar failed to load: " + (e?.message || e) + " — try a different AVATAR_URL");
    console.error(e);
  }

  // ── TTS: turn text into { audio, words, wtimes, wdurations } for speakAudio ──
  // Stage 1 uses a backend /tts endpoint (Piper/Kokoro on AWS, free). We evenly
  // distribute word timings across the clip — good enough for lip-sync; we can
  // upgrade to real per-word timings later.
  async function synthesize(text) {
    const r = await fetch("/tts", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, avatar_id: avatarId }),
    });
    if (!r.ok) throw new Error("/tts not available yet (" + r.status + ")");
    const buf = await r.arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const audio = await ctx.decodeAudioData(buf);
    const words = text.trim().split(/\s+/);
    const per = (audio.duration * 1000) / Math.max(words.length, 1);
    const wtimes = words.map((_, i) => Math.round(i * per));
    const wdurations = words.map(() => Math.round(per * 0.9));
    return { audio, words, wtimes, wdurations };
  }

  async function say(text) {
    if (!text.trim()) return;
    try {
      status("synthesizing…");
      const a = await synthesize(text);
      pauseMicWhileSpeaking(a.audio.duration);
      head.speakAudio(a);
      status("speaking: " + text.slice(0, 60));
    } catch (e) {
      status("speak failed: " + (e?.message || e));
      console.error(e);
    }
  }

  // ── grounded answer that can ACT: /live/act (RAG + Groq + tools), then speak ──
  // She may calculate, check a deadline, or look up a record before answering.
  async function ask(question) {
    status("thinking…");
    const r = await fetch("/live/act", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ avatar_id: avatarId, question }),
    });
    const text = await r.text(); // SSE: data: {"content": "..."} lines
    const parts = [...text.matchAll(/data: (\{.*?\})/g)].map((m) => {
      try { return JSON.parse(m[1]).content; } catch { return ""; }
    });
    const answer = parts.join(" ").trim();
    if (answer) await say(answer);
    else status("(she stayed silent — not in her knowledge)");
  }

  document.getElementById("speakBtn").onclick = () =>
    say(document.getElementById("q").value);
  document.getElementById("askBtn").onclick = () =>
    ask(document.getElementById("q").value);

  // ── voice input: talk to Laura with your mic (Web Speech API, free, Chrome) ──
  // Click 🎤 to toggle. What you say is transcribed in-browser and sent to the
  // grounded+tools brain (/live/act); she answers out loud. While SHE speaks the
  // mic pauses so she doesn't hear herself. Meeting mode doesn't use this (Recall
  // pipes the meeting transcript through the backend websocket instead).
  const micBtn = document.getElementById("micBtn");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micOn = false, micPaused = false, rec = null, micResumeTimer = null;

  function pauseMicWhileSpeaking(durationSec) {
    if (!micOn || !rec) return;
    micPaused = true;
    try { rec.stop(); } catch (_) {}
    clearTimeout(micResumeTimer);
    micResumeTimer = setTimeout(() => {
      micPaused = false;
      if (micOn) { try { rec.start(); } catch (_) {} }
    }, (durationSec + 0.8) * 1000);
  }

  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = "Voice input needs Chrome/Edge (Web Speech API)";
  } else {
    rec = new SR();
    rec.lang = "en-US";
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = (ev) => {
      const heard = ev.results[ev.results.length - 1][0].transcript.trim();
      if (!heard) return;
      document.getElementById("q").value = heard;
      status("heard: " + heard);
      ask(heard); // grounded + tools, spoken back
    };
    // Chrome ends recognition on silence — restart while toggled on (not while
    // she's speaking: pauseMicWhileSpeaking owns the restart in that window).
    rec.onend = () => { if (micOn && !micPaused) { try { rec.start(); } catch (_) {} } };
    rec.onerror = (e) => {
      if (e.error === "not-allowed") { micOn = false; micBtn.textContent = "🎤 Talk"; status("mic blocked — allow microphone access"); }
    };
    micBtn.onclick = () => {
      micOn = !micOn;
      if (micOn) {
        try { rec.start(); } catch (_) {}
        micBtn.textContent = "🔴 Listening…";
        micBtn.style.background = "#c0392b";
        status("listening — just talk to Laura");
      } else {
        clearTimeout(micResumeTimer); micPaused = false;
        try { rec.stop(); } catch (_) {}
        micBtn.textContent = "🎤 Talk";
        micBtn.style.background = "";
        status("mic off");
      }
    };
  }

  // Backend can also drive her via a "speak" message (kept for the Recall path).
  window.speak = say;

  // ── Meeting mode: same contract as avatar.html so /talk is a drop-in for the
  // Anam page. When a conversation_id is present (Recall renders us with one), we
  // open the backend websocket and speak whatever {type:"speak",text} it pushes —
  // exactly what _make_avatar_speak sends. Only the RENDERER changed (Anam -> our
  // TalkingHead + free TTS); the backend brain/contract are untouched.
  const conversationId = params.get("conversation_id");
  if (conversationId) {
    const connect = () => {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws/${conversationId}`);
      ws.onopen = () =>
        setInterval(() => ws.readyState === 1 && ws.send("ping"), 15000);
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "speak" && msg.text) say(msg.text);
        } catch (_) { /* ignore non-JSON */ }
      };
      ws.onclose = () => setTimeout(connect, 2000);
    };
    connect();
  }
</script>
