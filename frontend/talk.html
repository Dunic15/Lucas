<!--
  Laura — open-source avatar page (Anam replacement, Stage 1).

  Runs ENTIRELY in the browser: TalkingHead (3D avatar, Three.js/WebGL) renders a
  Ready Player Me character and lip-syncs to audio we feed it. No Anam, no GPU
  server. Recall's web_gpu bot renders this page as the meeting camera.

  Pipeline (arrows written as -> on purpose: a dash-dash-gt sequence closes a comment):
    meeting question -> (backend transcript) -> we call /live/ask (RAG + Groq)
      -> answer text -> TTS (audio) -> head.speakAudio(...) -> lip-synced speech
      -> Recall captures this page's canvas+audio -> streamed into the meeting

  TESTING STAGES (open this file via the backend, e.g. http://localhost:8000/talk):
    1. Avatar RENDERS (idle: breathing, blinking).            [no backend TTS needed]
    2. Type text + "Speak"  -> she lip-syncs it.               [needs /tts endpoint]
    3. Ask a question       -> she pulls a grounded answer.    [needs /tts + /live/ask]

  The model is /laura.glb — an HD photorealistic avatar vendored into this repo
  (Ready Player Me shut down Jan 2026, so we self-host). To try another model:
  ?avatar_url=<glb-url> (needs ARKit + Oculus viseme morph targets). Sources:
  Avaturn or MetaPerson/AvatarSDK exports are compatible.
-->
<style>
  html, body { margin: 0; height: 100%; background: #dfe3e8; }
  /* Bright-office backdrop, webcam depth-of-field style: pale warm wall, soft
     daylight from the left, a hint of warm interior light right, faint
     out-of-focus depth. Light and clean — reads as a tidy office on webcam.
     The canvas is transparent so this shows through. Framing is done with the
     3D camera (see below), NOT a CSS transform: CSS scaling magnifies rendered
     pixels and blurs her; camera zoom stays sharp. */
  #stage {
    position: fixed; inset: 0;
    /* Hidden until the close-up camera is asserted, so the page NEVER shows the
       far full-body default view; she appears already framed like a webcam. */
    opacity: 0; transition: opacity .45s ease;
    background:
      radial-gradient(46% 60% at 14% 30%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%),
      radial-gradient(40% 50% at 84% 28%, rgba(255,226,190,.34) 0%, rgba(255,226,190,0) 70%),
      radial-gradient(30% 42% at 78% 74%, rgba(196,210,224,.30) 0%, rgba(196,210,224,0) 70%),
      radial-gradient(3% 5% at 88% 40%, rgba(255,238,210,.45) 0%, rgba(255,238,210,0) 100%),
      radial-gradient(2.4% 4% at 71% 22%, rgba(255,244,224,.40) 0%, rgba(255,244,224,0) 100%),
      linear-gradient(180deg, #f5f3ef 0%, #ece9e5 42%, #dfdfdf 75%, #d2d7dd 100%);
  }
  #stage.live { opacity: 1; }
  /* Browser B0 presentation: the browser fills the frame, the avatar shrinks
     to a legible corner tile (Recall's 720p ceiling — spec §3 gate). z above
     the browser iframe so the avatar stays visible while she narrates. */
  body.browser-presenting #stage {
    position: fixed; inset: auto 2.5% 2.5% auto;
    width: 26%; height: 26%; z-index: 50;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  /* Soft vignette pulls the eye to her face, like a real webcam lens -
     kept very light so the office stays bright. */
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 60%, rgba(90,104,122,.20) 100%);
  }
  /* MEETING MODE (?conversation_id= present): she must look like just another
     participant; no buttons, no status text, nothing but her. */
  body.meeting #hud, body.meeting #status { display: none; }
  /* PREVIEW MODE (?preview=1): the dashboard's Avatars stage embeds this page
     as a same-origin iframe for a live 3D idle preview — same chrome-less look
     as meeting mode, but with NO conversation_id there is no SSE/poll/speaking
     heartbeat and nothing billable: just the model rendering. */
  body.preview #hud, body.preview #status { display: none; }
  #hud {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; z-index: 10;
    font: 14px/1.4 system-ui, sans-serif;
  }
  #hud input {
    width: 320px; max-width: 60vw; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #2a2f37; background: #171b21; color: #e8ecf1;
  }
  #hud button {
    padding: 10px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: #2f6df6; color: #fff; font-weight: 600;
  }
  #hud button.alt { background: #2a2f37; }
  #status {
    position: fixed; left: 14px; top: 12px; z-index: 10; color: #9aa4b1;
    font: 12px/1.4 ui-monospace, monospace; background: #131720cc;
    padding: 6px 10px; border-radius: 8px; max-width: 70vw;
  }
</style>

<div id="stage"></div>
<div id="status">loading…</div>
<div id="hud">
  <input id="q" placeholder="Type something for Laura to say…" />
  <button id="speakBtn">Speak</button>
  <button id="askBtn" class="alt">Ask (grounded + acts)</button>
  <button id="micBtn" class="alt" title="Talk to Laura by voice">🎤 Talk</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.1.7/+esm",
    "marked": "https://cdn.jsdelivr.net/npm/marked@14.1.3/+esm",
    "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.4/modules/talkinghead.mjs"
  }
}
</script>

<script type="module">
  import { TalkingHead } from "talkinghead";
  import * as THREE from "three";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

  const params = new URLSearchParams(location.search);

  // Dashboard stage preview (?preview=1): hide the HUD/status chrome so only
  // the avatar shows. Everything network-side stays untouched — with no
  // conversation_id this page never opens SSE/polling or reports speaking
  // state, so an embedded preview costs nothing and starts no session.
  if (params.get("preview") === "1") document.body.classList.add("preview");

  // HD photorealistic models (samples from the TalkingHead repo), vendored
  // into OUR repo and served same-origin: Ready Player Me's CDN shutdown
  // (Jan 2026) killed the previous third-party URL — never again. Override for
  // A/B tests with ?avatar_url=<glb url> (must have ARKit+Oculus viseme morphs).
  const avatarId = params.get("avatar_id") || "laura";
  // Identity-safe model resolution: a meeting may only render the selected
  // avatar's own file. Explicit URL overrides remain a preview-only developer
  // feature; they are ignored for Recall meeting pages.
  const explicitAvatarUrl = params.get("conversation_id") ? null : params.get("avatar_url");
  const configuredFallback = params.get("face_fallback") || "none";
  const avatarUrlPromise = (async () => {
    if (explicitAvatarUrl) return explicitAvatarUrl;
    if (!/^[a-z0-9_-]+$/i.test(avatarId)) throw new Error("face_unavailable");
    try {
      const probe = await fetch(`/${avatarId}.glb`, { method: "HEAD" });
      if (probe.ok) return `/${avatarId}.glb`;
    } catch (_) {}
    throw new Error("face_unavailable");
  })();
  function sameAvatarFallback(reason) {
    if (params.get("fallback_attempted") === "1" ||
        configuredFallback !== "photoreal") return false;
    const next = new URL(location.href);
    next.pathname = "/photoreal";
    next.searchParams.set("avatar_id", avatarId);
    next.searchParams.set("fallback_attempted", "1");
    location.replace(next.pathname + next.search);
    return true;
  }
  // TalkingHead pose/gesture set ("F" | "M"). "F" is the historical default
  // (Laura); male avatars pass ?body=M until gender travels with avatar config.
  const BODY = (params.get("body") || "F").toUpperCase() === "M" ? "M" : "F";
  const status = (t) => (document.getElementById("status").textContent = t);

  const head = new TalkingHead(document.getElementById("stage"), {
    // TalkingHead's constructor THROWS if ttsEndpoint is missing — even though we
    // never call speakText(). We drive audio ourselves via speakAudio() with our own
    // free /tts, so this is a harmless dummy that is never actually fetched. (Without
    // it, the constructor throws at load and the whole page dies: no avatar, dead HUD.)
    ttsEndpoint: "/gtts-unused",
    lipsyncModules: ["en"],
    cameraView: "upper",
    cameraDistance: 0,
    avatarMood: "happy",          // subtle smile — reads far more human than neutral
    // Supersampling: 2x in the demo (a human's browser, sharpness is the point),
    // but keep the proven 1.5 on the Recall bot browser (web_4_core has no GPU
    // guarantee — an unverified +78% render load on the LIVE camera isn't worth
    // it when the close-up framing already added face pixels). Meeting mode is
    // detectable here: Recall always renders us with ?conversation_id=.
    // Off-Recall (standalone /talk) has NO 720p cap: 2x supersample already
    // renders the face far beyond 720p (a ~4000px canvas on a retina display).
    // Sharpness is not the bottleneck — physically-based lighting is (added
    // below). Recall meeting mode keeps the proven 1.5 (web_4_core has no GPU
    // guarantee) since TalkingHead multiplies this by devicePixelRatio.
    modelPixelRatio: params.get("conversation_id") ? 1.5 : 2,
    // Warm 3-point-ish light: sells skin as skin (values tuned live in-browser;
    // brighter blows out the cheeks, dimmer goes corpse-gray).
    lightAmbientColor: "#fff3e6",
    lightAmbientIntensity: 2.1,
    lightDirectColor: "#ffe4c8",
    lightDirectIntensity: 26,
  });

  try {
    status("loading avatar…");
    const AVATAR_URL = await avatarUrlPromise;
    await head.showAvatar({ url: AVATAR_URL, body: BODY, lipsyncLang: "en" });
    // Some avatar sources (e.g. MetaPerson — cedric.glb) ship per-eye eyeLook*
    // morphs but NOT the aggregate eyesLookUp/eyesLookDown that TalkingHead's
    // eye-contact system writes every frame. The missing key made animate()
    // throw per-frame: no blinking, no breathing, head frozen mid-pose.
    // Create the aggregates as INERT SINKS (they exist to be written, drive no
    // morphs): the vertical-gaze compensation that feeds them is calibrated to
    // RPM bind poses and computes garbage on this rig (~0.9 "look down" for a
    // level head). Forwarding even a capped value to the per-eye lookDown
    // morphs drooped his upper lids — he sat in meetings with his eyes shut.
    // Horizontal eye contact still works via the native eyeLookIn/Out morphs;
    // the camera sits at eye height, so vertical tracking loses nothing.
    const sinkEyeMorph = (agg, likeKey) => {
      if (head.mtAvatar?.[agg] || !head.mtAvatar?.[likeKey]) return;
      head.mtAvatar[agg] = Object.assign({}, head.mtAvatar[likeKey], {
        ms: [], is: [],
        value: 0, applied: 0, needsUpdate: false,
        system: null, fixed: null, newvalue: null, base: null, limit: null,
      });
      // The blink limiter reads the sink's value and would pin his lids
      // >= eyesLookDown/2 — the same garbage signal by another path. Blink
      // anims write the eyeBlink morphs directly, so dropping the limiter
      // only removes the bogus floor, never real blinks.
      for (const k of ["eyeBlinkLeft", "eyeBlinkRight"]) {
        if (head.mtAvatar[k]) head.mtAvatar[k].limit = null;
      }
    };
    sinkEyeMorph("eyesLookDown", "eyeLookDownLeft");
    sinkEyeMorph("eyesLookUp", "eyeLookUpLeft");
    // MetaPerson skeletons carry different bind orientations than the RPM/
    // Avaturn rigs TalkingHead's pose templates were authored on — untouched,
    // the head lands pitched ~25° down staring at the floor. A small fixed
    // baseline levels it (values tuned live against cedric.glb). Keyed on the
    // rig's AvatarHead mesh, so laura.glb (Avaturn, no such node) is untouched.
    if (head.armature?.getObjectByName?.("AvatarHead")) {
      head.setBaselineValue("headRotateX", -0.45);
      head.setBaselineValue("headRotateY", 0.08);
    }
    // ── Laura photoreal lift ──────────────────────────────────────────────
    // SAME avatar (laura.glb) — just rendered as photoreal as a GLB gets. The
    // GPU photoreal-VIDEO path (Ditto/MuseTalk on Runpod) is off, and the
    // standalone /talk page is OFF-Recall (no 720p/15fps cap), so we spend the
    // headroom on physically-based rendering: image-based lighting for real skin
    // specular + reflections, ACES filmic tone mapping so highlights read like a
    // photo instead of clipping flat, and sRGB output. Laura-only — Cedric keeps
    // his separately-tuned MetaPerson look. Everything tunable live in-browser:
    // ?env= (IBL strength, 0 disables) and ?exposure=.
    if (avatarId === "laura") {
      try {
        const _f = (k, d) => { const v = parseFloat(params.get(k)); return Number.isNaN(v) ? d : v; };
        if (head.renderer) {
          head.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          head.renderer.toneMappingExposure = _f("exposure", 1.0);
          head.renderer.outputColorSpace = THREE.SRGBColorSpace;
        }
        const envI = _f("env", 0.35);
        if (envI > 0 && head.scene && head.renderer) {
          // Procedural neutral-studio IBL — no external HDR file, fully offline.
          // A neutral, softer env at a controlled strength reads more natural than
          // TalkingHead's default (intensity 1), whose brightness pushed the skin
          // toward blown-out/waxy (the very "brighter blows out the cheeks" the
          // light tuning fought). One knob — scene.environmentIntensity — scales it.
          const pmrem = new THREE.PMREMGenerator(head.renderer);
          head.scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
          head.scene.environmentIntensity = envI;
          pmrem.dispose();
        }
      } catch (err) {
        // Never let a rendering-quality tweak break the avatar: fall back to the
        // proven light-only look (Cedric's path never runs this at all).
        console.warn("[talk] photoreal lift skipped:", err);
      }
    }
    head.start();
    // Meeting-webcam framing: CLOSE face shot, eyes on the upper third, a hint
    // of shoulders — like a participant sitting near their camera. Values tuned
    // live in-browser at 1280x720 (Recall's capture size). Direct camera control
    // renders at native resolution (sharp), unlike CSS scaling. TalkingHead
    // re-frames the camera shortly after start(), so assert our framing several
    // times to win the race — and keep #stage hidden until the first assert so
    // the far full-body default view is NEVER visible (no far->close jump).
    window.__head = head; // handy for live debugging/tuning
    // Head-and-shoulders framing with full headroom: the previous close-up
    // (z=1.55) cropped the top of her hair and felt uncomfortably near. z=1.9
    // shows the complete head + shoulders like a well-framed webcam. Tune live
    // without code changes via ?cam_z= (distance) ?cam_y= (camera height)
    // ?cam_ty= (look-at height).
    const camParam = (k, d) => { const v = parseFloat(params.get(k)); return Number.isNaN(v) ? d : v; };
    const CAM_Z = camParam("cam_z", 2.0);
    let CAM_Y = camParam("cam_y", 1.675);
    let CAM_TY = camParam("cam_ty", 1.705);
    // Per-avatar auto-framing: the constants above were tuned on laura.glb,
    // whose EYE LINE measures worldY≈1.726 — so they encode "camera at
    // eyes−0.051, look-at at eyes−0.021". A shorter rig (petra.glb: eyes at
    // ≈1.597, 13cm lower) framed with laura's constants ends up with her face
    // at the BOTTOM of the shot. Measure this rig's eye bones once the
    // armature exists and re-derive both heights with the same tuned offsets:
    // laura reproduces 1.675/1.705 exactly, every other avatar centers
    // automatically. Explicit ?cam_y=/?cam_ty= URL params still win.
    let eyeLineDone = params.has("cam_y") || params.has("cam_ty");
    const measureEyeLine = () => {
      if (eyeLineDone || !head.armature) return;
      let sum = 0, n = 0;
      head.armature.traverse((o) => {
        if (/^(left|right)eye$/i.test(o.name)) {
          const p = new o.position.constructor();
          o.getWorldPosition(p); sum += p.y; n++;
        }
      });
      eyeLineDone = true; // measure once; rigs without eye bones keep the tuned defaults
      if (!n) return;
      const eyes = sum / n;
      CAM_Y = eyes - 0.051;
      CAM_TY = eyes - 0.021;
    };
    const frameCamera = () => {
      try {
        // Kill TalkingHead's own camera GLIDE at the source: after setView its
        // animate loop eases the camera toward ITS view for 1000ms (while
        // cameraClock < 1000, talkinghead.mjs ~L2459) — and since its loop runs
        // interleaved with ours, that glide is the visible far->close zoom on
        // load, no matter how often we re-assert our framing. cameraClock=1000
        // ends any glide instantly; a no-op setView stops it ever restarting.
        head.cameraClock = 1000;
        head.setView = () => {};
        // TalkingHead's OrbitControls clamp minDistance=2.0 — any closer framing
        // silently snaps back to z=2.0 (this was why she never got truly close).
        // Release the clamp, then place the camera. enableDamping=false so any
        // camera move is INSTANT, never a smooth far->close glide on load.
        if (head.controls) { head.controls.minDistance = 0.3; head.controls.enableDamping = false; }
        head.camera.position.set(0, CAM_Y, CAM_Z);
        if (head.controls) { head.controls.target.set(0, CAM_TY, 0); head.controls.update?.(); }
      } catch (_) { /* keep default view if internals change */ }
    };
    // She should look INTO the camera like a person on a call, not into the
    // distance. makeEyeContact expires, so renew it on an interval.
    const gazeAtCamera = () => {
      try { head.lookAtCamera(600); head.makeEyeContact(30000); } catch (_) {}
    };
    // PIN the framing every animation frame: TalkingHead keeps re-framing the
    // camera on its own schedule (observed a drift to z=2.0 seconds after load),
    // so one-shot asserts always eventually lose. Setting three floats per frame
    // is free and makes the close-up rock-solid.
    let pinnedFrames = 0, revealed = false;
    const reveal = () => { if (!revealed) { revealed = true; document.getElementById("stage").classList.add("live"); } };
    (function pinFraming() {
      // Where TalkingHead left the camera since our last assert. During its
      // intro zoom-in this is still far from our close-up; once it settles it
      // sits at (our) CAM_Z because nothing else moves it.
      measureEyeLine(); // no-op after the first successful measurement
      const beforeZ = head.camera?.position?.z;
      frameCamera();
      // Reveal only once TalkingHead has STOPPED pulling the camera off our
      // close-up for a few consecutive frames — so the first VISIBLE frame is
      // already the tight webcam shot, never a far->close zoom. (Checking the
      // value we just set would reveal instantly, mid-zoom — that was the bug.)
      if (!revealed) {
        pinnedFrames = (beforeZ != null && Math.abs(beforeZ - CAM_Z) < 0.03) ? pinnedFrames + 1 : 0;
        if (pinnedFrames >= 4) reveal();
      }
      requestAnimationFrame(pinFraming);
    })();
    gazeAtCamera();
    for (const ms of [600, 1500, 3000]) setTimeout(gazeAtCamera, ms);
    setInterval(gazeAtCamera, 25000);
    setTimeout(reveal, 2500); // fallback: never leave the stage hidden, even if it never settles
    status("live — avatar rendering ✅ (type + Speak to test lip-sync)");
  } catch (e) {
    const reason = e?.message || String(e);
    if (!sameAvatarFallback(reason)) {
      status("face_unavailable: " + avatarId);
      const stage = document.getElementById("stage");
      stage.replaceChildren();
      const notice = document.createElement("div");
      notice.setAttribute("role", "alert");
      notice.style.cssText = "margin:auto;padding:24px;text-align:center;font:600 24px system-ui;color:#26313d";
      notice.textContent = avatarId + " face unavailable";
      stage.appendChild(notice);
      stage.classList.add("live");
    }
    console.error(e);
  }

  // ── TTS: turn text into { audio, words, wtimes, wdurations } for speakAudio ──
  // /tts returns JSON: base64 mp3 + (with ElevenLabs) REAL per-word timings from
  // character-level alignment — that's what makes the lips match the voice. If
  // timings are absent (edge-tts fallback), spread words evenly as approximation.
  // ONE reusable AudioContext for decoding: browsers hard-cap ~6 live contexts,
  // and a long meeting synthesizes many sentences — a fresh context per sentence
  // eventually throws and the avatar goes silent. Lazily created, never closed.
  let _decodeCtx = null;
  const decodeCtx = () => (_decodeCtx ||= new (window.AudioContext || window.webkitAudioContext)());
  // Decode a TTS payload ({audio: base64 mp3, words?, wtimes?, wdurations?})
  // into what speakAudio wants. Shared by the /tts fetch path AND the
  // server-attached-audio path (the backend now ships the voice inside the
  // speak message itself, so no /tts round-trip is needed for those).
  async function payloadToAudio(j, text) {
    const bin = Uint8Array.from(atob(j.audio), (c) => c.charCodeAt(0));
    const audio = await decodeCtx().decodeAudioData(bin.buffer);
    let { words, wtimes, wdurations } = j;
    if (!words || !words.length) {
      words = text.trim().split(/\s+/);
      const per = (audio.duration * 1000) / Math.max(words.length, 1);
      wtimes = words.map((_, i) => Math.round(i * per));
      wdurations = words.map(() => Math.round(per * 0.9));
    }
    return { audio, words, wtimes, wdurations };
  }
  async function synthesize(text) {
    const r = await fetch("/tts", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, avatar_id: avatarId }),
    });
    if (!r.ok) throw new Error("/tts not available yet (" + r.status + ")");
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return payloadToAudio(j, text);
  }

  // Browsers start AudioContexts suspended until a user gesture — and TalkingHead
  // plays speech through ITS OWN context created at page load. Without this
  // resume, the demo is SILENT: lips move, no sound. (Meeting mode always had a
  // defensive resume; the demo path didn't — that was the "she's not talking"
  // bug.) Resume on every speak AND on the first gesture, both harmless no-ops
  // once the context is running.
  const unlockAudio = () => {
    try { head.audioCtx?.resume?.(); } catch (_) {}
    try { head.audioContext?.resume?.(); } catch (_) {}
  };
  document.addEventListener("pointerdown", unlockAudio, { once: true });
  document.addEventListener("keydown", unlockAudio, { once: true });

  // Pipelined speech: START synthesis the moment a sentence arrives (so sentence
  // 2's audio is being fetched while sentence 1 plays — no gaps between
  // sentences), but hand audio to speakAudio strictly in arrival order so she
  // never speaks out of sequence. TalkingHead queues speakAudio internally.
  let _sayChain = Promise.resolve();
  let _sayGen = 0; // bumped on interrupt: queued sentences from before are dropped
  // Barge-in: a human started talking over her — stop the mouth NOW (TalkingHead
  // stopSpeaking cancels current audio + its internal queue) and drop anything
  // we queued but haven't synthesized/handed over yet.
  function interruptSpeech() {
    _sayGen++;
    _sayChain = Promise.resolve();
    try { head.stopSpeaking(); } catch (_) {}
    // Kill the in-flight brain request too: chunks that arrived AFTER a human cut
    // her off used to be spoken anyway (stop, then resume with the next streamed
    // chunk) — an interrupt must cancel the whole turn, not just the current audio.
    if (_askController) { try { _askController.abort(); } catch (_) {} }
    _thinking = false;
    // Collapse the "she is speaking" window: the audio it covered was just
    // cancelled. A stale window kept the echo filter armed for seconds after an
    // interrupt, swallowing real follow-up questions as "her own echo".
    speakingUntil = 0;
    herText = "";
    status("(interrupted — listening)");
  }
  window.interruptSpeech = interruptSpeech;
  // Sentences accepted but not yet handed to the mouth (fetching/queued). Lets
  // the speaking-state reporter below treat "about to speak" as speaking, so a
  // finished-audio gap between two queued sentences never reads as silence.
  let _pendingSay = 0;
  // Per-sentence emotion (backend emotion.py) -> TalkingHead mood. Mirrors the
  // server's label set; anything unknown stays neutral so the face is never
  // driven to a mood the model can't show.
  const MOOD_FOR = { neutral: "neutral", happy: "happy", excited: "happy",
                     serious: "neutral", concerned: "sad" };
  function say(text, pre) {
    if (!text || !text.trim()) return _sayChain;
    unlockAudio();
    // Server-attached audio (pre.audio) skips the whole /tts round-trip —
    // the voice arrived inside the speak message. Otherwise fetch as before.
    const synth = pre && pre.audio ? payloadToAudio(pre, text) : synthesize(text);
    const mood = MOOD_FOR[(pre && pre.emotion) || "neutral"] || "neutral";
    const gen = _sayGen;
    _pendingSay++;
    _sayChain = _sayChain.then(async () => {
      try {
        const a = await synth;
        if (gen !== _sayGen) return; // interrupted while synthesizing — drop it
        try { head.setMood(mood); } catch (_) {} // lean the face into the line
        markSpeaking(a.audio.duration, text);
        head.speakAudio(a);
        status("speaking: " + text.slice(0, 60));
      } catch (e) {
        status("speak failed: " + (e?.message || e));
        console.error(e);
      } finally {
        _pendingSay = Math.max(0, _pendingSay - 1);
      }
    });
    return _sayChain;
  }

  // ── grounded answer that can ACT: /live/act (RAG + Groq + tools), then speak ──
  // She may calculate, check a deadline, or look up a record before answering.
  let _askController = null;
  let _thinking = false; // a /live/act request is in flight (thinking or searching)
  async function ask(question) {
    // A new user turn cuts off whatever she's saying now AND aborts any older
    // in-flight request (a web search can take ~15s) — she's never "blocked"
    // waiting on the old search.
    interruptSpeech();
    status("thinking…");
    const ctrl = new AbortController();
    _askController = ctrl;
    _thinking = true;
    const genAtStart = _sayGen; // an interrupt mid-stream bumps this — stop speaking
    let r;
    try {
      r = await fetch("/live/act", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ avatar_id: avatarId, question }),
        signal: ctrl.signal,
      });
    } catch (e) {
      if (ctrl === _askController) _thinking = false;
      if (e && e.name === "AbortError") return; // superseded or stopped by the user
      status("ask failed: " + (e?.message || e));
      return;
    }
    // Stream the SSE and speak each chunk as it arrives — so the "let me search"
    // filler plays immediately and the searched answer follows when it's ready,
    // instead of dead air until the whole thing is done.
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", saidAny = false;
    try {
      for (;;) {
        const { done, value } = await reader.read();
        if (done || ctrl.signal.aborted || _sayGen !== genAtStart) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n\n")) >= 0) {
          const evt = buf.slice(0, nl); buf = buf.slice(nl + 2);
          const m = evt.match(/^data: (\{.*\})$/m);
          if (!m) continue;
          let content; try { content = JSON.parse(m[1]).content; } catch { continue; }
          if (content && !ctrl.signal.aborted && _sayGen === genAtStart) { say(content); saidAny = true; }
        }
      }
    } catch (e) { if (!(e && e.name === "AbortError")) console.error(e); }
    if (ctrl === _askController) _thinking = false;
    if (!saidAny && !ctrl.signal.aborted) status("(she stayed silent)");
  }

  document.getElementById("speakBtn").onclick = () =>
    say(document.getElementById("q").value);
  document.getElementById("askBtn").onclick = () =>
    ask(document.getElementById("q").value);

  // ── voice input: talk to Laura with your mic (Web Speech API, free, Chrome) ──
  // Click 🎤 to toggle. What you say is transcribed in-browser and sent to the
  // grounded+tools brain (/live/act); she answers out loud. The mic keeps
  // LISTENING while she talks so you can barge in ("wait Laura") and cut her off —
  // stop commands also cancel a THINKING/SEARCHING turn, not just her voice;
  // her own voice bleeding into the mic is filtered out by comparing what's heard
  // against what she's currently saying. (Headphones make barge-in bulletproof.)
  // Meeting mode doesn't use this (Recall pipes the transcript over the websocket).
  const micBtn = document.getElementById("micBtn");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micOn = false, rec = null;
  let speakingUntil = 0;   // performance.now() until which SHE is considered speaking
  let herText = "";        // normalized words she's currently saying (echo filter)

  const _norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  // While she speaks, ignore transcripts that are mostly HER words (mic echo).
  function looksLikeEcho(heard) {
    const words = _norm(heard).split(" ").filter(Boolean);
    if (!words.length) return true;
    const her = new Set(herText.split(" ").filter(Boolean));
    if (!her.size) return false;
    return words.filter((w) => her.has(w)).length / words.length >= 0.5;
  }
  // Called from say() when audio starts: mark the speaking window + echo text.
  // (No longer stops the recognizer — we WANT to keep hearing the human.)
  function markSpeaking(durationSec, text) {
    speakingUntil = Math.max(speakingUntil, performance.now()) + (durationSec + 0.6) * 1000;
    herText = _norm(text);
  }
  window.markSpeaking = markSpeaking;

  // Stop commands: "Laura wait", "stop", "hold on"… obeyed INSTANTLY — even on a
  // partial transcript, even while she's mid-search — and NEVER forwarded to the
  // brain as a question. STRICT match: the utterance must be nothing but stop
  // vocabulary (+ her name / politeness), so a real question that merely contains
  // a stop word ("when do we stop the meter?") still reaches the brain. And only
  // when she isn't currently saying that stop word herself — otherwise her own
  // "hold on, let me check…" leaking into the mic would self-interrupt.
  // Longest-first so "one second" wins over "one sec" (a shorter prefix match
  // would leave a garbage remainder and break the strict whole-utterance test).
  const STOP_PHRASES = ["give me a second", "give me a moment", "give me a minute", "give me a sec", "that s enough", "stop talking", "one second", "one moment", "one minute", "never mind", "nevermind", "forget it", "be quiet", "hold on", "hang on", "shut up", "stop it", "one sec",
    // Italian
    "lascia stare", "lascia perdere", "non importa", "basta cos", "un attimo", "un secondo", "un momento"].sort((a, b) => b.length - a.length);
  const STOP_WORDS = new Set(["stop", "wait", "pause", "quiet", "silence", "enough", "hush", "shush",
    "aspetta", "fermati", "ferma", "zitta", "basta", "taci", "silenzio", "smettila"]);
  const POLITE_WORDS = new Set(["ok", "okay", "no", "hey", "please", "laura", "now", "just", "a", "one", "sec", "second", "moment", "minute", "thanks", "thank", "you",
    "per", "favore", "grazie", "un", "attimo", "secondo", "momento", "ora", "adesso", "ehi", "dai"]);
  function stopWordIn(h) {
    for (const p of STOP_PHRASES) if (h.includes(p)) return p;
    for (const w of h.split(" ")) if (STOP_WORDS.has(w)) return w;
    return null;
  }
  // Loose test: contains a stop word SHE isn't saying right now. Used to catch a
  // stop buried in a garbled echo-mix transcript (her words + yours interleaved).
  function containsStopWord(heard) {
    const w = stopWordIn(_norm(heard));
    return !!w && !herText.includes(w);
  }
  // Strict test: the WHOLE utterance is stop vocabulary — this one gets swallowed.
  function isStopCommand(heard) {
    let h = _norm(heard);
    if (!h || !containsStopWord(heard)) return false;
    for (const p of STOP_PHRASES) h = h.split(p).join(" ");
    return h.split(" ").filter(Boolean).every((w) => STOP_WORDS.has(w) || POLITE_WORDS.has(w));
  }

  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = "Voice input needs Chrome/Edge (Web Speech API)";
  } else {
    rec = new SR();
    rec.lang = "en-US";
    rec.continuous = true;
    rec.interimResults = true; // partials let us cut her off the instant you speak
    rec.onresult = (ev) => {
      const res = ev.results[ev.results.length - 1];
      const heard = (res[0] && res[0].transcript || "").trim();
      if (!heard) return;
      // Estimated window OR the renderer's live flag — the estimate alone ended
      // early sometimes (queue lag), leaving a window where talking over her did
      // nothing until your sentence finalized.
      const sheSpeaking = performance.now() < speakingUntil || !!head.isSpeaking;
      // "Laura stop" while she's talking, thinking, or searching: obey NOW
      // (partials included) and swallow it — it's a command, not a question.
      if ((sheSpeaking || _thinking) && isStopCommand(heard)) {
        interruptSpeech();
        status("(stopped — listening)");
        return;
      }
      if (sheSpeaking && looksLikeEcho(heard)) {
        // A stop buried in an echo-mix transcript (her leaked audio + your
        // "stop") still stops her — but a garbled mix is never a question.
        if (containsStopWord(heard)) interruptSpeech();
        return;
      }
      if (sheSpeaking) interruptSpeech();              // real human over her — STOP
      if (!res.isFinal) { status("hearing: " + heard); return; }
      // A bare "stop"/"wait" when she's already idle: nothing to stop, and the
      // brain must not answer it as if it were a question.
      if (isStopCommand(heard)) { status("(listening)"); return; }
      document.getElementById("q").value = heard;
      status("heard: " + heard);
      ask(heard); // grounded + tools, spoken back
    };
    // Chrome ends recognition on silence — restart while toggled on.
    rec.onend = () => { if (micOn) { try { rec.start(); } catch (_) {} } };
    rec.onerror = (e) => {
      if (e.error === "not-allowed") { micOn = false; micBtn.textContent = "🎤 Talk"; status("mic blocked — allow microphone access"); }
    };
    micBtn.onclick = () => {
      micOn = !micOn;
      if (micOn) {
        try { rec.start(); } catch (_) {}
        micBtn.textContent = "🔴 Listening…";
        micBtn.style.background = "#c0392b";
        status("listening — talk to Laura (say 'wait Laura' to cut her off)");
      } else {
        try { rec.stop(); } catch (_) {}
        micBtn.textContent = "🎤 Talk";
        micBtn.style.background = "";
        status("mic off");
      }
    };
  }

  // Backend can also drive her via a "speak" message (kept for the Recall path).
  window.speak = say;

  // ── Meeting mode: same contract as avatar.html so /talk is a drop-in for the
  // Anam page. When a conversation_id is present (Recall renders us with one), we
  // listen for {type:"speak",text} from the backend — exactly what
  // _make_avatar_speak sends. Only the RENDERER changed (Anam -> our TalkingHead
  // + free TTS); the backend brain/contract are untouched.
  const conversationId = params.get("conversation_id");
  if (conversationId) {
    document.body.classList.add("meeting"); // hide all UI — just her

    // The Recall bot browser never clicks — resume defensively on load too
    // (same shared unlockAudio as the demo path).
    unlockAudio();

    // Optional generation ids (additive, backward compatible): if the backend
    // ever stamps messages with generation_id, a stop invalidates every speak
    // from the same-or-older generation — so a speak that raced the stop over
    // the wire can never un-mute her. Messages without ids behave as before.
    let staleBefore = -Infinity;
    const genOf = (msg) => {
      const g = msg.generation_id ?? msg.speech_generation_id ?? msg.generation;
      return typeof g === "number" ? g : null;
    };
    const handleBackendMessage = (msg) => {
      if (!msg) return;
      if (msg.type === "speak" && msg.text) {
        const g = genOf(msg);
        if (g !== null && g <= staleBefore) return; // stale: superseded by a stop
        unlockAudio(); say(msg.text, msg); // msg may carry server-synthesized audio
      } else if (msg.type === "stop") { // barge-in: human is talking
        const g = genOf(msg);
        if (g !== null) staleBefore = Math.max(staleBefore, g);
        interruptSpeech();
      } else if (msg.type === "raise_hand") {
        // Hand-raise etiquette: she has a point queued and waits to be
        // invited — hand stays up on her tile until the backend lowers it.
        try { head.playGesture("handup", 600, false, 900); } catch (_) {}
      } else if (msg.type === "lower_hand") {
        try { head.stopGesture(900); } catch (_) {}
      } else if (msg.type === "browser_view") {
        // Browser operator B0 presentation: show a read-only live-view iframe
        // overlay and shrink the avatar to a corner tile. Additive control
        // message on the same at-most-once queue (never a second consumer of
        // the speak channel); pages that don't know the type ignore it.
        // TalkingHead keeps rendering; CSS-only. The URL is a viewer surface
        // handed back by the server-side presentation-token exchange — never
        // a permanent provider URL.
        showBrowserView(msg.url);
      } else if (msg.type === "browser_view_hide") {
        hideBrowserView();
      }
    };

    // B0 presentation overlay (CSS-only; created lazily so flag-off pages are
    // byte-identical — no DOM, no listeners until a browser_view arrives).
    function showBrowserView(url){
      if(!url) return;
      var wrap = document.getElementById("browser-view");
      if(!wrap){
        wrap = document.createElement("div");
        wrap.id = "browser-view";
        wrap.style.cssText = "position:fixed;inset:0;z-index:40;background:#000";
        var f = document.createElement("iframe");
        f.id = "browser-view-frame";
        f.setAttribute("sandbox", "allow-scripts allow-same-origin");
        f.style.cssText = "width:100%;height:100%;border:0";
        wrap.appendChild(f);
        document.body.appendChild(wrap);
      }
      document.getElementById("browser-view-frame").src = url;
      document.body.classList.add("browser-presenting"); // shrinks avatar tile
    }
    function hideBrowserView(){
      var wrap = document.getElementById("browser-view");
      if(wrap) wrap.remove();
      document.body.classList.remove("browser-presenting");
    }

    // Path 1: SSE push — App Runner 403s WebSocket upgrades at the edge but
    // streams SSE fine, so speak messages arrive within ~100ms instead of
    // waiting out a poll interval. EventSource auto-reconnects when App Runner
    // recycles the request (~2min), and the slow poll below covers the gap.
    const es = new EventSource(`/avatar/stream/${encodeURIComponent(conversationId)}`);
    es.onmessage = (ev) => {
      try { handleBackendMessage(JSON.parse(ev.data)); } catch (_) { /* non-JSON */ }
    };

    // Path 2: slow HTTP polling as belt-and-braces (2s — SSE does the real-time
    // work). Both paths drain the same backend queue, so a message is only ever
    // delivered once; whichever path gets there first wins.
    const poll = async () => {
      try {
        const r = await fetch(`/avatar/messages/${encodeURIComponent(conversationId)}`,
                              { cache: "no-store" });
        if (r.ok) {
          const data = await r.json();
          for (const msg of data.messages || []) handleBackendMessage(msg);
        }
      } catch (_) { /* keep polling */ }
      setTimeout(poll, 2000);
    };
    poll();

    // Report the REAL speaking state to the backend: its barge-in window is
    // otherwise a words-per-second estimate that drifts both ways on long
    // answers. True = heartbeat while anything is playing or queued (the
    // backend extends the window a beat past the next report); one false on
    // the transition closes the window the moment she actually goes quiet.
    let reportedSpeaking = false;
    setInterval(() => {
      const speaking =
        _pendingSay > 0 || !!head.isSpeaking || performance.now() < speakingUntil;
      if (!speaking && !reportedSpeaking) return; // idle→idle: nothing to report
      reportedSpeaking = speaking;
      fetch(`/avatar/speaking/${encodeURIComponent(conversationId)}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ speaking }),
      }).catch(() => {});
    }, 700);
  }
</script>
