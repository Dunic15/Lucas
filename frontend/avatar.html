<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sofia — AI Process Expert</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #stage iframe { width: 100%; height: 100%; border: 0; }
    #badge {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      font: 600 14px/1.2 system-ui, sans-serif; color: #cfe0ff;
      background: rgba(11,16,32,.6); padding: 8px 12px; border-radius: 999px;
      backdrop-filter: blur(6px);
    }
    #badge .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
      background:#3ad29f; margin-right:8px; vertical-align:middle; }
  </style>
</head>
<body>
  <!--
    This page is what the Recall.ai bot renders as its camera in the meeting.
    It embeds the Tavus conversation (the avatar's face, voiced by ElevenLabs)
    and opens a websocket to our backend. When the backend's "brain" decides
    the avatar should speak, it sends {type:"speak", text}; we forward that to
    Tavus as an `echo` interaction so the avatar speaks those exact words.

    INTEGRATION SEAM TO VERIFY against current Tavus + Daily docs:
      - the echo app-message schema (message_type/event_type/properties.text)
      - that Recall captures the embedded Daily iframe's audio.
    Both are isolated in speak() below — adjust there if a vendor changes.
  -->
  <div id="stage"></div>
  <div id="badge"><span class="dot"></span>Sofia · AI Process Expert</div>

  <!-- Pinned version to limit supply-chain surface. For production, add a
       verified Subresource Integrity hash: integrity="sha384-..." -->
  <script src="https://unpkg.com/@daily-co/daily-js@0.72.2/dist/daily-iframe.js"
          crossorigin="anonymous"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const conversationUrl = params.get("conversation_url");
    const conversationId  = params.get("conversation_id");

    let callFrame = null;

    function joinAvatarRoom() {
      callFrame = window.DailyIframe.createFrame(
        document.getElementById("stage"),
        {
          showLeaveButton: false,
          showFullscreenButton: false,
          iframeStyle: { width: "100%", height: "100%", border: "0" },
        }
      );
      callFrame.join({ url: conversationUrl });
    }

    // Make the Tavus avatar say `text` via an echo interaction.
    function speak(text) {
      if (!callFrame) return;
      callFrame.sendAppMessage(
        {
          message_type: "conversation",
          event_type: "conversation.echo",
          conversation_id: conversationId,
          properties: { text },
        },
        "*"
      );
    }

    function connectBackend() {
      const wsProto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${wsProto}://${location.host}/ws/${conversationId}`);

      ws.onopen = () => setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) ws.send("ping");
      }, 15000);

      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "speak" && msg.text) speak(msg.text);
        } catch (_) { /* ignore non-JSON */ }
      };

      // Reconnect if the socket drops mid-meeting.
      ws.onclose = () => setTimeout(connectBackend, 2000);
    }

    if (!conversationUrl || !conversationId) {
      document.getElementById("badge").textContent =
        "Missing conversation params";
    } else {
      joinAvatarRoom();
      connectBackend();
    }
  </script>
</body>
</html>
