<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laura: AI Process Expert</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden;
      font: 600 14px/1.3 system-ui, sans-serif; color: #cfe0ff; }
    #avatar-video { position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #0b1020; }

    /* identity badge (bottom-left) */
    #badge {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      background: rgba(11,16,32,.6); padding: 8px 12px; border-radius: 999px;
      backdrop-filter: blur(6px);
    }
    #badge .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
      background:#3ad29f; margin-right:8px; vertical-align:middle; }
    #badge.speaking .dot { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(58,210,159,.7); transform: scale(1); }
      50%     { box-shadow: 0 0 0 7px rgba(58,210,159,0); transform: scale(1.25); }
    }

    /* connection-status pill (top-right) */
    #status {
      position: fixed; right: 16px; top: 16px; z-index: 10;
      background: rgba(11,16,32,.6); padding: 6px 12px; border-radius: 999px;
      backdrop-filter: blur(6px); font-size: 12px; color: #93a1c8;
      display: flex; align-items: center; gap: 7px;
    }
    #status .sdot { width:8px; height:8px; border-radius:50%; background:#93a1c8; }
    #status.connecting .sdot { background:#ffcf6b; }
    #status.live       .sdot { background:#3ad29f; }
    #status.error      .sdot { background:#ff8a8a; }

    /* caption bar (bottom-center) */
    #caption {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 10; max-width: min(80vw, 720px); text-align: center;
      background: rgba(11,16,32,.72); padding: 10px 16px; border-radius: 12px;
      backdrop-filter: blur(6px); color: #e6ecff; font-weight: 500;
      opacity: 0; transition: opacity .25s ease;
    }
    #caption.show { opacity: 1; }
  </style>
</head>
<body>
  <!--
    This page is what the Recall.ai bot renders as its camera in the meeting.
    It streams the Anam avatar (the face, voiced by ElevenLabs) into the <video>
    below and opens a websocket to our backend. When Recall transcribes a wake-word
    question, the backend sends {type:"ask", text}; we forward that to Anam via
    client.sendUserMessage(text) so Liv answers from her own thesis knowledge.
    The older {type:"speak", text} path is kept for direct backend-driven speech.

    HOW THE PIECES CONNECT:
      - ?conversation_url=<Anam sessionToken>  (minted by backend anam_client.py)
      - ?conversation_id=<our routing id>      (keys the backend websocket)

    INTEGRATION SEAM TO VERIFY on a first live run:
      - the Anam SDK export/method names (createClient / streamToVideoElement /
        sendUserMessage / talk) against the current @anam-ai/js-sdk;
      - that Recall captures the <video> element's audio+video.
    All isolated below; adjust if the vendor changes.

    Manually test the caption without a backend: open devtools and run
      speak("Testing the caption bar.")
  -->
  <video id="avatar-video" autoplay playsinline></video>
  <div id="badge"><span class="dot"></span>Laura · AI Process Expert</div>
  <div id="status" class="connecting"><span class="sdot"></span><span id="statusText">Connecting…</span></div>
  <div id="caption"></div>

  <script type="module">
    // Pinned SDK to limit supply-chain surface.
    import { createClient, AnamEvent } from "https://esm.sh/@anam-ai/js-sdk@4.17.1";

    const params = new URLSearchParams(location.search);
    const avatarId       = params.get("avatar_id") || "laura"; // which persona
    const conversationId = params.get("conversation_id");      // backend ws key

    let anam = null;
    let captionTimer = null;
    let streamId = null;
    let streamText = "";

    // ── UI helpers ──────────────────────────────────────────────────
    function setStatus(state, text) {
      document.getElementById("status").className = state;   // connecting|live|error
      document.getElementById("statusText").textContent = text;
    }
    function showCaption(text) {
      const cap = document.getElementById("caption");
      cap.textContent = text; cap.classList.add("show");
      clearTimeout(captionTimer);
      captionTimer = setTimeout(() => cap.classList.remove("show"), 6000);
    }
    function setSpeaking(on) {
      document.getElementById("badge").classList.toggle("speaking", on);
    }

    // ── Anam stream (the avatar's face) ─────────────────────────────
    async function joinAvatar() {
      // Mint a FRESH Anam token at render time (so scheduled/calendar bots work -
      // a token baked into the URL would expire before a future meeting starts).
      const tr = await fetch("/live/token", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ avatar_id: avatarId }) });
      const tok = await tr.json();
      if (tok.error) throw new Error(tok.error);
      anam = createClient(tok.session_token);
      anam.addListener(AnamEvent.MESSAGE_STREAM_EVENT_RECEIVED, (e) => {
        if (!e || e.role !== "persona") return;
        if (e.id !== streamId) { streamId = e.id; streamText = ""; }
        streamText += e.content || "";
        if (streamText.trim()) {
          showCaption(streamText);
          setSpeaking(true);
        }
        if (e.endOfSpeech) setSpeaking(false);
      });
      anam.addListener(AnamEvent.TOOL_CALL_STARTED, () => showCaption("Searching thesis knowledge..."));
      anam.addListener(AnamEvent.VIDEO_PLAY_STARTED, () => setStatus("live", "Live"));
      await anam.streamToVideoElement("avatar-video");
      setStatus("live", "Live");
    }

    // Make the avatar say `text`, and caption it. Kept as the single entrypoint
    // the backend drives via the websocket (unchanged protocol).
    //
    // The backend now STREAMS answers one sentence per "speak" message so the
    // avatar can start talking before the full answer is generated. Queue them so
    // they play in order rather than interrupting each other. Pacing is estimated
    // from sentence length; tune it once Anam's talk-complete behavior is
    // confirmed on a live run (an SDK "speech finished" event would be exact).
    let speakQueue = [];
    let draining = false;
    function speak(text) {
      speakQueue.push(text);
      if (!draining) drainSpeak();
    }
    function drainSpeak() {
      const text = speakQueue.shift();
      if (text === undefined) { draining = false; setSpeaking(false); return; }
      draining = true;
      showCaption(text);
      setSpeaking(true);
      if (!anam || typeof anam.talk !== "function") {
        speakQueue.unshift(text);
        setTimeout(drainSpeak, 300);
        return;
      }
      anam.talk(text);
      setTimeout(drainSpeak, Math.min(7000, 900 + text.length * 55));
    }
    window.speak = speak;   // exposed for manual devtools testing

    function askPersona(text) {
      showCaption("Thinking...");
      setSpeaking(true);
      streamId = null;
      streamText = "";
      if (anam && typeof anam.sendUserMessage === "function") {
        anam.sendUserMessage(text);
      }
    }

    function handleBackendMessage(msg) {
      if (msg.type === "speak" && msg.text) speak(msg.text);
      if (msg.type === "ask" && msg.text) askPersona(msg.text);
    }

    // ── Backend websocket (unchanged contract) ──────────────────────
    function connectBackend() {
      const wsProto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${wsProto}://${location.host}/ws/${conversationId}`);
      ws.onopen = () => setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) ws.send("ping");
      }, 15000);
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          handleBackendMessage(msg);
        } catch (_) { /* ignore non-JSON */ }
      };
      ws.onclose = () => setTimeout(connectBackend, 2000);
    }

    // App Runner currently rejects WebSocket upgrades for this service. Poll as
    // a production-safe fallback; if the websocket works later, this endpoint is
    // usually empty because messages are delivered over the socket first.
    async function pollBackendMessages() {
      try {
        const r = await fetch(`/avatar/messages/${encodeURIComponent(conversationId)}`, {
          cache: "no-store",
        });
        if (r.ok) {
          const data = await r.json();
          for (const msg of data.messages || []) handleBackendMessage(msg);
        }
      } catch (_) { /* keep polling */ }
      setTimeout(pollBackendMessages, 500);
    }

    // ── boot / graceful degradation ─────────────────────────────────
    if (!conversationId) {
      setStatus("error", "Missing conversation params");
      document.getElementById("badge").innerHTML =
        '<span class="dot" style="background:#ff8a8a"></span>Waiting for a session…';
    } else {
      joinAvatar().catch((e) => {
        console.error(e);
        setStatus("error", "Avatar stream failed");
      });
      connectBackend();
      pollBackendMessages();
      // Stop the Anam stream when the bot leaves / page unloads (stop billing).
      const stop = () => { try { anam && anam.stopStreaming && anam.stopStreaming(); } catch(_){} };
      window.addEventListener("pagehide", stop);
      window.addEventListener("beforeunload", stop);
    }
  </script>
</body>
</html>
