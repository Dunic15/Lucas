<!--
  Laura - PHOTOREAL avatar page (Stage 2). Renders video frames streamed from
  the GPU box (gpu/server.py: MuseTalk lip-sync, or its stub engine) instead of
  the 3D TalkingHead model. Same backend contract as talk.html: SSE push +
  slow-poll of speak messages, /tts for the voice - only the RENDERER differs.

  Flow per utterance:
    backend speak msg -> /tts (ElevenLabs mp3) -> send audio_b64 to GPU ws
      -> GPU replies talk_start + lip-synced JPEG frames -> page plays the mp3
      -> mouth and sound line up -> Recall captures canvas+audio

  Fallbacks, in order: GPU unreachable -> static reference portrait + audio
  still plays (she keeps answering, face just doesn't move). No /tts -> silent.

  Config: fetches /photoreal/config for the GPU stream URL (backend env
  GPU_STREAM_URL, e.g. wss://gpu.lauravatar.com/stream). ?stream_url= overrides
  for testing.
-->
<style>
  html, body { margin: 0; height: 100%; background: #10161d; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #10161d; }
  #frame { width: 100%; height: 100%; object-fit: cover; }
  #hud {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; z-index: 10;
    font: 14px/1.4 system-ui, sans-serif;
  }
  #hud input {
    width: 320px; max-width: 60vw; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #2a2f37; background: #171b21; color: #e8ecf1;
  }
  #hud button {
    padding: 10px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: #2f6df6; color: #fff; font-weight: 600;
  }
  #status {
    position: fixed; left: 14px; top: 12px; z-index: 10; color: #9aa4b1;
    font: 12px/1.4 ui-monospace, monospace; background: #131720cc;
    padding: 6px 10px; border-radius: 8px; max-width: 70vw;
  }
  body.meeting #hud, body.meeting #status { display: none; }
</style>

<div id="stage"><img id="frame" alt="" /></div>
<div id="status">connecting…</div>
<div id="hud">
  <input id="q" placeholder="Type something for Laura to say…" />
  <button id="speakBtn">Speak</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const avatarId = params.get("avatar_id") || "laura";
  const conversationId = params.get("conversation_id");
  const status = (t) => (document.getElementById("status").textContent = t);
  const frameEl = document.getElementById("frame");
  // static portrait until the stream is up — per-avatar so the wake-up
  // window shows the right face (route falls back to Laura if unknown)
  frameEl.src = "/laura-reference.jpg?avatar_id=" + encodeURIComponent(avatarId);

  // Fallback chain (issue #3): GPU stream -> static portrait -> /talk avatar.
  // If even the static portrait can't load (and no stream is feeding frames),
  // hand the meeting to the 3D /talk page so she always has a face.
  frameEl.onerror = () => {
    if (!gpuReady && frameEl.src.includes("/laura-reference.jpg")) {
      status("static portrait unavailable — falling back to /talk");
      location.replace("/talk" + location.search);
    }
  };

  // ── GPU frame stream ─────────────────────────────────────────────────────
  let gpu = null;          // websocket to gpu/server.py
  let gpuReady = false;
  let lastUrl = null;      // revoke previous blob URL to avoid leaking
  let pendingAudio = [];   // audio clips awaiting their first frame
  let waitingFirstFrame = false; // talk_start seen, audio starts on next frame

  // Frame presentation is locked to the AUDIO clock, not to frame arrival.
  // The GPU tags each talk frame with its native-timeline index (frame i belongs
  // at audio second i/nativeFps). We buffer a clip's frames and, every display
  // tick, paint the newest frame whose moment the audio has already reached —
  // holding the last one if the next hasn't been generated yet, dropping
  // intermediates after a stall. This is what keeps the mouth on the voice when
  // generation runs below realtime (the drift the newest-wins scheme couldn't
  // correct). A server that doesn't tag frames (legacy/stub) or an idle frame
  // between clips falls back to newest-wins.
  let nextBlob = null;        // newest-wins fallback (untagged / idle frames)
  let frameBuf = new Map();   // native index -> blob, for the current clip
  let pendingIdx = null;      // index the next binary frame carries (from text)
  let usingClock = false;     // is the current clip audio-clock driven?
  let clipStart = null;       // actx.currentTime when this clip's audio started
  let shownIdx = -1;
  let nativeFps = 25;
  function paintBlob(blob) {
    const url = URL.createObjectURL(blob);
    frameEl.src = url;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;
  }
  function renderLoop() {
    if (usingClock && clipStart != null && frameBuf.size) {
      const target = Math.floor((actx.currentTime - clipStart) * nativeFps);
      let best = -1;
      for (const k of frameBuf.keys()) { if (k <= target && k > best) best = k; }
      if (best < 0) { for (const k of frameBuf.keys()) if (best < 0 || k < best) best = k; }
      if (best !== shownIdx && frameBuf.has(best)) {
        paintBlob(frameBuf.get(best));
        shownIdx = best;
        for (const k of [...frameBuf.keys()]) if (k < best) frameBuf.delete(k);
      }
    } else if (nextBlob) {
      paintBlob(nextBlob);
      nextBlob = null;
    }
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  async function connectGpu() {
    let streamUrl = params.get("stream_url");
    if (!streamUrl) {
      try {
        const r = await fetch("/photoreal/config");
        streamUrl = (await r.json()).stream_url;
      } catch (_) { /* backend unreachable */ }
    }
    if (!streamUrl) { status("no GPU stream configured — static portrait mode"); return; }
    // multi-volto: dice al GPU server QUALE faccia servire su questa
    // connessione (un server a volto singolo la ignora — retrocompatibile)
    streamUrl += (streamUrl.includes("?") ? "&" : "?") + "avatar_id=" + encodeURIComponent(avatarId);
    const ws = new WebSocket(streamUrl);
    ws.binaryType = "blob";
    ws.onopen = () => { gpu = ws; status("GPU stream connected"); };
    ws.onmessage = (ev) => {
      if (typeof ev.data === "string") {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "hello") {
            gpuReady = true;
            if (msg.fps) nativeFps = msg.fps;
            status(`live — ${msg.mode} engine @ ${msg.fps}fps`);
          }
          // New clip: reset the frame clock + ring. Audio still starts on the
          // clip's FIRST frame (the GPU takes ~200-400ms to produce it, and
          // starting the sound early is a head start the lips never recover).
          if (msg.type === "talk_start") {
            frameBuf.clear(); pendingIdx = null; usingClock = false;
            clipStart = null; shownIdx = -1;
            if (pendingAudio.length) waitingFirstFrame = true;
          }
          // Each talk frame's native-timeline index arrives just before its JPEG.
          if (msg.type === "frame") { pendingIdx = msg.i; usingClock = true; }
        } catch (_) {}
        return;
      }
      // binary JPEG frame
      if (pendingIdx != null) { frameBuf.set(pendingIdx, ev.data); pendingIdx = null; }
      else { nextBlob = ev.data; }              // untagged (legacy/idle) → newest-wins
      if (waitingFirstFrame && pendingAudio.length) {
        waitingFirstFrame = false;
        playClip(pendingAudio.shift());          // anchors clipStart to audio start
      }
    };
    ws.onclose = () => { gpu = null; gpuReady = false; status("GPU stream lost — retrying"); setTimeout(connectGpu, 3000); };
  }
  connectGpu();

  // ── audio playback (the page is the meeting's audio source) ─────────────
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  const unlockAudio = () => { try { actx.resume(); } catch (_) {} };
  async function playClip(buf) {
    unlockAudio();
    const audio = await actx.decodeAudioData(buf.slice(0));
    const src = actx.createBufferSource();
    src.buffer = audio; src.connect(actx.destination);
    const when = actx.currentTime;
    // Anchor the frame clock to the audio start: frame i is due at when + i/fps.
    // On audio end, release to idle newest-wins — but ONLY if this is still the
    // live clip (guard on `when`, so a previous clip's late onended can't cancel
    // the clock of the clip that already replaced it).
    src.onended = () => { if (clipStart === when) { usingClock = false; clipStart = null; } };
    src.start(when);
    if (usingClock) clipStart = when;
  }

  // ── speak: TTS -> GPU (frames) + local playback, serialized in order ────
  // Long answers are split into sentence-sized clips: Ditto generates at
  // ~23fps against a 25fps timeline, so lips fall ~0.1s behind per second of
  // audio. Per-clip alignment (audio starts on the clip's first frame) resets
  // that drift at every sentence — it can never accumulate past ~0.2s.
  function sentenceChunks(text, max = 160) {
    const parts = text.match(/[^.!?…]+[.!?…]+["»']?\s*|[^.!?…]+\s*$/g) || [text];
    const chunks = [];
    let cur = "";
    for (const p of parts) {
      if (cur && (cur + p).length > max) { chunks.push(cur.trim()); cur = p; }
      else cur += p;
    }
    if (cur.trim()) chunks.push(cur.trim());
    return chunks;
  }
  let chain = Promise.resolve();
  function say(text, emotion) {
    if (!text || !text.trim()) return chain;
    // Whole-answer emotion applies to each sentence clip it's split into.
    for (const piece of sentenceChunks(text)) sayOne(piece, emotion);
    return chain;
  }
  function sayOne(text, emotion) {
    const synth = (async () => {
      const r = await fetch("/tts", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ text, avatar_id: avatarId }),
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      return j.audio; // base64 mp3
    })();
    chain = chain.then(async () => {
      try {
        const audioB64 = await synth;
        const bytes = Uint8Array.from(atob(audioB64), (c) => c.charCodeAt(0)).buffer;
        if (gpu && gpuReady) {
          pendingAudio.push(bytes);                 // played on the clip's first frame
          // emotion rides the speak message (additive): the GPU maps it to
          // Ditto's `emo` so the whole face leans, not just the mouth. A
          // single-mood server ignores the field.
          gpu.send(JSON.stringify({ type: "speak", audio_b64: audioB64,
                                    emotion: emotion || "neutral" }));
        } else {
          await playClip(bytes);                    // static-portrait fallback
        }
        status("speaking: " + text.slice(0, 60));
      } catch (e) { status("speak failed: " + (e?.message || e)); }
    });
    return chain;
  }
  document.getElementById("speakBtn").onclick = () => say(document.getElementById("q").value);
  window.speak = say;

  // ── meeting mode: identical to talk.html (SSE push + slow poll) ─────────
  if (conversationId) {
    document.body.classList.add("meeting");
    const handle = (msg) => { if (msg && msg.type === "speak" && msg.text) { unlockAudio(); say(msg.text, msg.emotion); } };
    const es = new EventSource(`/avatar/stream/${encodeURIComponent(conversationId)}`);
    es.onmessage = (ev) => { try { handle(JSON.parse(ev.data)); } catch (_) {} };
    const poll = async () => {
      try {
        const r = await fetch(`/avatar/messages/${encodeURIComponent(conversationId)}`, { cache: "no-store" });
        if (r.ok) for (const m of (await r.json()).messages || []) handle(m);
      } catch (_) {}
      setTimeout(poll, 2000);
    };
    poll();
  }
</script>
