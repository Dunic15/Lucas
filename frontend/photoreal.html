<!--
  Laura - PHOTOREAL avatar page (Stage 2). Renders video frames streamed from
  the GPU box (gpu/server.py: MuseTalk lip-sync, or its stub engine) instead of
  the 3D TalkingHead model. Same backend contract as talk.html: SSE push +
  slow-poll of speak messages, /tts for the voice - only the RENDERER differs.

  Flow per utterance:
    backend speak msg -> /tts (ElevenLabs mp3) -> send audio_b64 to GPU ws
      -> GPU replies talk_start + lip-synced JPEG frames -> page plays the mp3
      -> mouth and sound line up -> Recall captures canvas+audio

  Fallbacks, in order: GPU unreachable -> static reference portrait + audio
  still plays (she keeps answering, face just doesn't move). No /tts -> silent.

  Config: fetches /photoreal/config for the GPU stream URL (backend env
  GPU_STREAM_URL, e.g. wss://gpu.lauravatar.com/stream). ?stream_url= overrides
  for testing.
-->
<style>
  html, body { margin: 0; height: 100%; background: #10161d; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #10161d; }
  #frame { width: 100%; height: 100%; object-fit: cover; }
  #hud {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; z-index: 10;
    font: 14px/1.4 system-ui, sans-serif;
  }
  #hud input {
    width: 320px; max-width: 60vw; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #2a2f37; background: #171b21; color: #e8ecf1;
  }
  #hud button {
    padding: 10px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: #2f6df6; color: #fff; font-weight: 600;
  }
  #status {
    position: fixed; left: 14px; top: 12px; z-index: 10; color: #9aa4b1;
    font: 12px/1.4 ui-monospace, monospace; background: #131720cc;
    padding: 6px 10px; border-radius: 8px; max-width: 70vw;
  }
  body.meeting #hud, body.meeting #status { display: none; }
  #raisedHand {
    position: fixed; right: 6%; top: 8%; z-index: 12; display: none;
    font-size: clamp(64px, 12vw, 150px); filter: drop-shadow(0 8px 18px #0008);
  }
  #faceUnavailable {
    position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
    padding: 24px; text-align: center; color: #fff; background: #10161d;
    font: 600 24px/1.4 system-ui, sans-serif;
  }
</style>

<div id="stage"><img id="frame" alt="" /></div>
<div id="raisedHand" aria-label="Hand raised">✋</div>
<div id="faceUnavailable" role="alert"></div>
<div id="status">connecting…</div>
<div id="hud">
  <input id="q" placeholder="Type something for Laura to say…" />
  <button id="speakBtn">Speak</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const avatarId = params.get("avatar_id") || "laura";
  const conversationId = params.get("conversation_id");
  const status = (t) => (document.getElementById("status").textContent = t);
  const frameEl = document.getElementById("frame");
  const configuredFallback = params.get("face_fallback") || "talk";
  function faceUnavailable(reason) {
    const box = document.getElementById("faceUnavailable");
    box.textContent = `${avatarId} face unavailable (${reason}).`;
    box.style.display = "grid";
    status("face_unavailable");
  }
  function fallbackSameAvatar(reason) {
    if (params.get("fallback_attempted") === "1" ||
        !["talk", "photoreal", "avatar"].includes(configuredFallback) ||
        configuredFallback === "photoreal") {
      faceUnavailable(reason); return;
    }
    const next = new URL(location.href);
    next.pathname = "/" + configuredFallback;
    next.searchParams.set("avatar_id", avatarId);
    next.searchParams.set("fallback_attempted", "1");
    location.replace(next.pathname + next.search);
  }
  // Static portrait until the stream is up. The backend returns only this
  // avatar's configured portrait; missing/unknown identities fail closed.
  frameEl.src = "/laura-reference.jpg?avatar_id=" + encodeURIComponent(avatarId);

  // Fallback chain (issue #3): GPU stream -> static portrait -> /talk avatar.
  // If even the static portrait can't load (and no stream is feeding frames),
  // hand the meeting to the 3D /talk page so she always has a face.
  frameEl.onerror = () => {
    if (!gpuReady && frameEl.src.includes("/laura-reference.jpg")) {
      status("static portrait unavailable; trying same-avatar fallback");
      fallbackSameAvatar("portrait");
    }
  };

  // ── GPU frame stream ─────────────────────────────────────────────────────
  let gpu = null;          // websocket to gpu/server.py
  let gpuReady = false;
  let lastUrl = null;      // revoke previous blob URL to avoid leaking
  let pendingAudio = [];   // {bytes,generation,epoch,text} awaiting first frame
  let waitingFirstFrame = false; // talk_start seen, audio starts on next frame
  let activeSource = null;
  let activeGpuGeneration = null;
  let staleBefore = -Infinity;
  let playbackEpoch = 0;
  let dropNextBinary = false;

  const genOf = (msg) => {
    const g = msg?.generation_id ?? msg?.speech_generation_id ?? msg?.generation;
    return typeof g === "number" ? g : null;
  };
  const isStale = (generation, epoch) =>
    epoch !== playbackEpoch || (generation !== null && generation <= staleBefore);

  // Frame presentation is locked to the AUDIO clock, not to frame arrival.
  // The GPU tags each talk frame with its native-timeline index (frame i belongs
  // at audio second i/nativeFps). We buffer a clip's frames and, every display
  // tick, paint the newest frame whose moment the audio has already reached -
  // holding the last one if the next hasn't been generated yet, dropping
  // intermediates after a stall. This is what keeps the mouth on the voice when
  // generation runs below realtime (the drift the newest-wins scheme couldn't
  // correct). A server that doesn't tag frames (legacy/stub) or an idle frame
  // between clips falls back to newest-wins.
  let nextBlob = null;        // newest-wins fallback (untagged / idle frames)
  let frameBuf = new Map();   // native index -> blob, for the current clip
  let pendingIdx = null;      // index the next binary frame carries (from text)
  let usingClock = false;     // is the current clip audio-clock driven?
  let clipStart = null;       // actx.currentTime when this clip's audio started
  let shownIdx = -1;
  let nativeFps = 25;
  function paintBlob(blob) {
    const url = URL.createObjectURL(blob);
    frameEl.src = url;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;
  }
  function renderLoop() {
    if (usingClock && clipStart != null && frameBuf.size) {
      const target = Math.floor((actx.currentTime - clipStart) * nativeFps);
      let best = -1;
      for (const k of frameBuf.keys()) { if (k <= target && k > best) best = k; }
      if (best < 0) { for (const k of frameBuf.keys()) if (best < 0 || k < best) best = k; }
      if (best !== shownIdx && frameBuf.has(best)) {
        paintBlob(frameBuf.get(best));
        shownIdx = best;
        for (const k of [...frameBuf.keys()]) if (k < best) frameBuf.delete(k);
      }
    } else if (nextBlob) {
      paintBlob(nextBlob);
      nextBlob = null;
    }
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  async function connectGpu() {
    let streamUrl = params.get("stream_url");
    if (!streamUrl) {
      try {
        const r = await fetch(
          "/photoreal/config?avatar_id=" + encodeURIComponent(avatarId),
          { cache: "no-store" }
        );
        const cfg = await r.json();
        if (!r.ok || cfg.face_ready === false) {
          fallbackSameAvatar("photoreal asset");
          return;
        }
        streamUrl = cfg.stream_url;
      } catch (_) { /* backend unreachable */ }
    }
    if (!streamUrl) { status("no GPU stream configured; static portrait mode"); return; }
    // multi-volto: dice al GPU server QUALE faccia servire su questa
    // connessione (un server a volto singolo la ignora; retrocompatibile)
    streamUrl += (streamUrl.includes("?") ? "&" : "?") + "avatar_id=" + encodeURIComponent(avatarId);
    const ws = new WebSocket(streamUrl);
    ws.binaryType = "blob";
    ws.onopen = () => { gpu = ws; status("GPU stream connected"); };
    ws.onmessage = (ev) => {
      if (typeof ev.data === "string") {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "hello") {
            gpuReady = true;
            if (msg.fps) nativeFps = msg.fps;
            status(`live: ${msg.mode} engine @ ${msg.fps}fps`);
          }
          // New clip: reset the frame clock + ring. Audio still starts on the
          // clip's FIRST frame (the GPU takes ~200-400ms to produce it, and
          // starting the sound early is a head start the lips never recover).
          if (msg.type === "face_unavailable") {
            gpuReady = false;
            status("photoreal face unavailable; trying same-avatar fallback");
            fallbackSameAvatar("GPU face");
            return;
          }
          if (msg.type === "talk_start") {
            const g = genOf(msg);
            if (g !== null && g <= staleBefore) {
              activeGpuGeneration = null; waitingFirstFrame = false;
              return;
            }
            activeGpuGeneration = g;
            frameBuf.clear(); pendingIdx = null; usingClock = false;
            clipStart = null; shownIdx = -1;
            if (pendingAudio.length) {
              const match = g === null ? 0 : pendingAudio.findIndex((x) => x.generation === g);
              if (match > 0) pendingAudio.unshift(pendingAudio.splice(match, 1)[0]);
              waitingFirstFrame = match >= 0 || g === null;
            }
          }
          if (msg.type === "talk_end") {
            const g = genOf(msg);
            if (g === null || g === activeGpuGeneration) activeGpuGeneration = null;
          }
          // Each talk frame's native-timeline index arrives just before its JPEG.
          if (msg.type === "frame") {
            const g = genOf(msg);
            if ((g !== null && g <= staleBefore) ||
                (activeGpuGeneration !== null && g !== null && g !== activeGpuGeneration)) {
              dropNextBinary = true; pendingIdx = null; return;
            }
            pendingIdx = msg.i; usingClock = true; dropNextBinary = false;
          }
        } catch (_) {}
        return;
      }
      // binary JPEG frame. A stale generation's frame is discarded instead of
      // becoming an idle frame that could visually restart cancelled speech.
      if (dropNextBinary) { dropNextBinary = false; return; }
      if (pendingIdx != null) {
        frameBuf.set(pendingIdx, ev.data); pendingIdx = null;
        // Defence-in-depth cap: pruning normally keeps this at 1-2 entries, but
        // never let a clock-skew regression grow it unbounded; drop oldest.
        while (frameBuf.size > 120) frameBuf.delete(Math.min(...frameBuf.keys()));
      } else { nextBlob = ev.data; }            // untagged (legacy/idle) → newest-wins
      if (waitingFirstFrame && pendingAudio.length) {
        waitingFirstFrame = false;
        const item = pendingAudio.shift();
        if (!isStale(item.generation, item.epoch)) playClip(item);
      }
    };
    ws.onclose = () => {
      gpu = null; gpuReady = false;
      // Drop any half-presented clip state so a reconnect starts clean, then
      // promptly play clips that were waiting for their first GPU frame using
      // the static portrait. They keep their original generation/cancel guards.
      frameBuf.clear(); pendingIdx = null; usingClock = false;
      clipStart = null; shownIdx = -1; nextBlob = null; activeGpuGeneration = null;
      const stranded = pendingAudio.splice(0).filter(
        (item) => !isStale(item.generation, item.epoch)
      );
      waitingFirstFrame = false;
      stranded.reduce((p, item) => p.then(() => playClip(item)), Promise.resolve());
      status("GPU stream lost; static portrait mode; retrying");
      setTimeout(connectGpu, 3000);
    };
  }
  connectGpu();

  // ── audio playback (the page is the meeting's audio source) ─────────────
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  const unlockAudio = () => { try { actx.resume(); } catch (_) {} };
  async function playClip(item) {
    if (!item || isStale(item.generation, item.epoch)) return;
    unlockAudio();
    const audio = await actx.decodeAudioData(item.bytes.slice(0));
    if (isStale(item.generation, item.epoch)) return;
    const src = actx.createBufferSource();
    src.buffer = audio; src.connect(actx.destination);
    const when = actx.currentTime;
    activeSource = src;
    await new Promise((resolve) => {
      src.onended = () => {
        if (activeSource === src) activeSource = null;
        if (clipStart === when) { usingClock = false; clipStart = null; }
        resolve();
      };
      src.start(when);
      if (usingClock) clipStart = when;
    });
  }

  function stopPlayback(generation = null) {
    if (generation !== null) staleBefore = Math.max(staleBefore, generation);
    playbackEpoch += 1;
    if (activeSource) {
      try { activeSource.stop(); } catch (_) {}
      try { activeSource.disconnect(); } catch (_) {}
      activeSource = null;
    }
    pendingAudio.length = 0;
    waitingFirstFrame = false; activeGpuGeneration = null;
    frameBuf.clear(); pendingIdx = null; usingClock = false;
    // Preserve dropNextBinary: a stale frame tag may already have arrived
    // while its paired JPEG is still in flight on the GPU socket.
    clipStart = null; shownIdx = -1; nextBlob = null;
    chain = Promise.resolve();
    if (gpu && gpu.readyState === WebSocket.OPEN) {
      gpu.send(JSON.stringify({ type: "stop", generation_id: generation }));
    }
  }

  // ── speak: TTS -> GPU (frames) + local playback, serialized in order ────
  // Long answers are split into sentence-sized clips: Ditto generates at
  // ~23fps against a 25fps timeline, so lips fall ~0.1s behind per second of
  // audio. Per-clip alignment (audio starts on the clip's first frame) resets
  // that drift at every sentence; it can never accumulate past ~0.2s.
  function sentenceChunks(text, max = 160) {
    const parts = text.match(/[^.!?…]+[.!?…]+["»']?\s*|[^.!?…]+\s*$/g) || [text];
    const chunks = [];
    let cur = "";
    for (const p of parts) {
      if (cur && (cur + p).length > max) { chunks.push(cur.trim()); cur = p; }
      else cur += p;
    }
    if (cur.trim()) chunks.push(cur.trim());
    return chunks;
  }
  let chain = Promise.resolve();
  function say(text, payload = {}) {
    if (!text || !text.trim()) return chain;
    if (typeof payload === "string") payload = { emotion: payload };
    // A backend-synthesized clip already matches the whole sentence/answer.
    // Reuse it byte-for-byte: never pay for or race a second /tts request.
    if (payload.audio) sayOne(text, payload);
    else for (const piece of sentenceChunks(text)) sayOne(piece, payload);
    return chain;
  }
  function sayOne(text, payload = {}) {
    const generation = genOf(payload);
    const epoch = playbackEpoch;
    const synth = payload.audio ? Promise.resolve(payload.audio) : (async () => {
      const r = await fetch("/tts", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ text, avatar_id: avatarId }),
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      return j.audio;
    })();
    chain = chain.then(async () => {
      try {
        const audioB64 = await synth;
        if (isStale(generation, epoch)) return;
        const bytes = Uint8Array.from(atob(audioB64), (c) => c.charCodeAt(0)).buffer;
        const item = { bytes, generation, epoch, text };
        status("speaking: " + text.slice(0, 60));
        if (gpu && gpuReady) {
          pendingAudio.push(item);
          gpu.send(JSON.stringify({
            type: "speak", audio_b64: audioB64,
            emotion: payload.emotion || "neutral", generation_id: generation,
          }));
        } else {
          await playClip(item);
        }
      } catch (e) { status("speak failed: " + (e?.message || e)); }
    });
    return chain;
  }
  document.getElementById("speakBtn").onclick = () => say(document.getElementById("q").value);
  window.speak = say;

  // ── meeting mode: identical to talk.html (SSE push + slow poll) ─────────
  if (conversationId) {
    document.body.classList.add("meeting");
    const handle = (msg) => {
      if (!msg) return;
      if (msg.type === "speak" && msg.text) {
        const g = genOf(msg);
        if (g !== null && g <= staleBefore) return;
        unlockAudio(); say(msg.text, msg);
      } else if (msg.type === "stop") {
        stopPlayback(genOf(msg));
      } else if (msg.type === "raise_hand") {
        document.getElementById("raisedHand").style.display = "block";
      } else if (msg.type === "lower_hand") {
        document.getElementById("raisedHand").style.display = "none";
      }
    };
    const es = new EventSource(`/avatar/stream/${encodeURIComponent(conversationId)}`);
    es.onmessage = (ev) => { try { handle(JSON.parse(ev.data)); } catch (_) {} };
    const poll = async () => {
      try {
        const r = await fetch(`/avatar/messages/${encodeURIComponent(conversationId)}`, { cache: "no-store" });
        if (r.ok) for (const m of (await r.json()).messages || []) handle(m);
      } catch (_) {}
      setTimeout(poll, 2000);
    };
    poll();

    // Report real playback/queue state, matching /talk. This makes barge-in use
    // the audio source of truth rather than a words-per-second estimate.
    let reportedSpeaking = false;
    setInterval(() => {
      const speaking = !!activeSource || pendingAudio.length > 0 || waitingFirstFrame;
      if (!speaking && !reportedSpeaking) return;
      reportedSpeaking = speaking;
      fetch(`/avatar/speaking/${encodeURIComponent(conversationId)}`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ speaking }),
      }).catch(() => {});
    }, 700);
  }
</script>
