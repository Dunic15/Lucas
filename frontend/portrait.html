<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Colleague</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden;
      font: 600 14px/1.3 system-ui, sans-serif; color: #cfe0ff; }

    /* ── the portrait + speaking ring ─────────────────────────────────── */
    #stage { position: fixed; inset: 0; display: grid; place-items: center; }
    #pfp {
      position: relative; width: min(46vmin, 340px); height: min(46vmin, 340px);
      border-radius: 50%;
    }
    #pfp img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      object-position: center 22%; display: block;
      border: 3px solid rgba(126,182,255,.25);
    }
    /* fallback initial when the portrait 404s */
    #pfp .fallback {
      position: absolute; inset: 0; display: none; place-items: center;
      border-radius: 50%; background: #1a2440; color: #7eb6ff;
      font-size: min(20vmin, 140px); font-weight: 700;
      border: 3px solid rgba(126,182,255,.25);
    }
    #pfp.broken img { display: none; }
    #pfp.broken .fallback { display: grid; }
    /* the blue ring: static soft ring at rest; pulsing halo while speaking */
    #pfp::after {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      border: 3px solid rgba(126,182,255,0); pointer-events: none;
      transition: border-color .25s ease;
    }
    body.speaking #pfp::after {
      border-color: rgba(126,182,255,.9);
      animation: halo 1.4s ease-out infinite;
    }
    @keyframes halo {
      0%   { transform: scale(1);    opacity: .95; }
      70%  { transform: scale(1.12); opacity: .25; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    /* second, offset ripple so the ring reads as "moving" not just blinking */
    #ring2 { position: absolute; inset: -10px; border-radius: 50%;
      border: 3px solid rgba(126,182,255,0); pointer-events: none; }
    body.speaking #ring2 {
      border-color: rgba(126,182,255,.6);
      animation: halo 1.4s ease-out .5s infinite;
    }
    /* hand-raise badge (same etiquette contract as /talk) */
    #hand { position: absolute; top: -6px; right: -6px; font-size: 44px;
      opacity: 0; transform: scale(.6); transition: all .25s ease; }
    body.handup #hand { opacity: 1; transform: scale(1); }

    /* identity badge (bottom-left) — same look as avatar.html */
    #badge {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      background: rgba(11,16,32,.6); padding: 8px 12px; border-radius: 999px;
      backdrop-filter: blur(6px);
    }
    #badge .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
      background:#3ad29f; margin-right:8px; vertical-align:middle; }
    body.speaking #badge .dot { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(58,210,159,.7); transform: scale(1); }
      50%     { box-shadow: 0 0 0 7px rgba(58,210,159,0); transform: scale(1.25); }
    }

    /* caption bar (bottom-center) — what she's saying, for accessibility */
    #caption {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 10; max-width: min(80vw, 720px); text-align: center;
      background: rgba(11,16,32,.72); padding: 10px 16px; border-radius: 12px;
      backdrop-filter: blur(6px); color: #e6ecff; font-weight: 500;
      opacity: 0; transition: opacity .25s ease;
    }
    #caption.show { opacity: 1; }
  </style>
</head>
<body>
  <!--
    Portrait renderer — the avatar's dashboard profile picture with an animated
    speaking ring. This page is what the Recall bot renders as its camera when
    an avatar's face tier is "portrait". It speaks with the SAME contract as
    /talk (the live-meeting contract is untouched):
      - SSE /avatar/stream/<conversation_id> + slow poll /avatar/messages/...
      - handles {type:"speak"|"stop"|"raise_hand"|"lower_hand"}
      - voice: server-attached audio in the speak message, else POST /tts
      - reports real speaking state to /avatar/speaking/<conversation_id>
    Only the renderer differs: no TalkingHead, no GPU — a picture and a ring.
  -->
  <div id="stage">
    <div id="pfp">
      <img id="photo" alt="" />
      <div class="fallback" id="fallback" aria-hidden="true"></div>
      <div id="ring2"></div>
      <div id="hand">✋</div>
    </div>
  </div>
  <div id="badge"><span class="dot"></span><span id="name">AI Colleague</span></div>
  <div id="caption" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  const params = new URLSearchParams(location.search);
  const avatarId = (params.get("avatar_id") || "laura").toLowerCase();
  const conversationId = params.get("conversation_id");

  // Portrait = the same per-avatar picture the dashboard shows (identity-safe
  // route: only this avatar's portrait, never another's). 404 -> initial.
  const photo = document.getElementById("photo");
  photo.src = "/laura-reference.jpg?avatar_id=" + encodeURIComponent(avatarId);
  photo.onerror = () => document.getElementById("pfp").classList.add("broken");
  const pretty = avatarId.charAt(0).toUpperCase() + avatarId.slice(1);
  document.getElementById("fallback").textContent = pretty.charAt(0);
  document.getElementById("name").textContent = pretty;
  document.title = pretty + " — AI Colleague";

  const caption = document.getElementById("caption");
  let captionTimer = null;
  function showCaption(text, ms) {
    caption.textContent = text;
    caption.classList.add("show");
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => caption.classList.remove("show"), ms);
  }

  // ── audio: decode TTS payloads and play them in order ────────────────
  // One reusable AudioContext (browsers cap ~6 live contexts; a long meeting
  // synthesizes many sentences — same lesson as /talk).
  let _ctx = null;
  const ctx = () => (_ctx ||= new (window.AudioContext || window.webkitAudioContext)());
  const unlockAudio = () => { try { ctx().resume(); } catch (_) {} };
  document.addEventListener("pointerdown", unlockAudio, { once: true });

  async function payloadToBuffer(j) {
    const bin = Uint8Array.from(atob(j.audio), (c) => c.charCodeAt(0));
    return await ctx().decodeAudioData(bin.buffer);
  }
  async function synthesize(text) {
    const r = await fetch("/tts", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, avatar_id: avatarId }),
    });
    if (!r.ok) throw new Error("/tts unavailable (" + r.status + ")");
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return payloadToBuffer(j);
  }

  // Pipelined, ordered speech with barge-in — mirrors /talk's queue: start
  // synthesis the moment a sentence arrives, play strictly in order, and an
  // interrupt drops everything queued (gen bump) and silences the current source.
  let _chain = Promise.resolve();
  let _gen = 0;
  let _pending = 0;      // accepted but not finished playing
  let _source = null;    // currently playing AudioBufferSourceNode
  function setSpeaking(on) { document.body.classList.toggle("speaking", on); }

  function interruptSpeech() {
    _gen++;
    _chain = Promise.resolve();
    if (_source) { try { _source.stop(); } catch (_) {} _source = null; }
    setSpeaking(false);
    caption.classList.remove("show");
  }

  function say(text, pre) {
    if (!text || !text.trim()) return;
    unlockAudio();
    const synth = pre && pre.audio ? payloadToBuffer(pre) : synthesize(text);
    const gen = _gen;
    _pending++;
    _chain = _chain.then(async () => {
      try {
        const buffer = await synth;
        if (gen !== _gen) return; // interrupted while synthesizing — drop it
        await new Promise((resolve) => {
          const src = ctx().createBufferSource();
          src.buffer = buffer;
          src.connect(ctx().destination);
          src.onended = () => { if (_source === src) _source = null; resolve(); };
          _source = src;
          setSpeaking(true);
          showCaption(text, buffer.duration * 1000 + 600);
          src.start();
        });
      } catch (e) {
        console.error("[portrait] speak failed:", e);
      } finally {
        _pending = Math.max(0, _pending - 1);
        if (_pending === 0 && !_source) setSpeaking(false);
      }
    });
  }

  // ── meeting mode: identical message contract to /talk ────────────────
  if (conversationId) {
    unlockAudio(); // the Recall bot browser never clicks

    let staleBefore = -Infinity;
    const genOf = (msg) => {
      const g = msg.generation_id ?? msg.speech_generation_id ?? msg.generation;
      return typeof g === "number" ? g : null;
    };
    const handleBackendMessage = (msg) => {
      if (!msg) return;
      if (msg.type === "speak" && msg.text) {
        const g = genOf(msg);
        if (g !== null && g <= staleBefore) return; // superseded by a stop
        unlockAudio(); say(msg.text, msg);
      } else if (msg.type === "stop") {
        const g = genOf(msg);
        if (g !== null) staleBefore = Math.max(staleBefore, g);
        interruptSpeech();
      } else if (msg.type === "raise_hand") {
        document.body.classList.add("handup");
      } else if (msg.type === "lower_hand") {
        document.body.classList.remove("handup");
      }
    };

    // Path 1: SSE push (App Runner 403s WebSocket upgrades; SSE streams fine).
    const es = new EventSource(`/avatar/stream/${encodeURIComponent(conversationId)}`);
    es.onmessage = (ev) => {
      try { handleBackendMessage(JSON.parse(ev.data)); } catch (_) { /* non-JSON */ }
    };

    // Path 2: slow poll as belt-and-braces; both drain the same queue.
    const poll = async () => {
      try {
        const r = await fetch(`/avatar/messages/${encodeURIComponent(conversationId)}`,
                              { cache: "no-store" });
        if (r.ok) {
          const data = await r.json();
          for (const msg of data.messages || []) handleBackendMessage(msg);
        }
      } catch (_) { /* keep polling */ }
      setTimeout(poll, 2000);
    };
    poll();

    // Report the REAL speaking state (backend barge-in window).
    let reported = false;
    setInterval(() => {
      const speaking = _pending > 0 || !!_source;
      if (!speaking && !reported) return;
      reported = speaking;
      fetch(`/avatar/speaking/${encodeURIComponent(conversationId)}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ speaking }),
      }).catch(() => {});
    }, 700);
  }

  // Manual preview: /portrait?avatar_id=laura&say=hello (no conversation_id).
  const demo = params.get("say");
  if (demo && !conversationId) setTimeout(() => say(demo), 600);
  window.speak = say;
  window.interruptSpeech = interruptSpeech;
})();
</script>
</body>
</html>
