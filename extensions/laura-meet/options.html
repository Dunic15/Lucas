<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laura for Meetings</title>
  <style>
    body {
      margin: 0;
      color: #202124;
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 560px;
      padding: 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 18px;
      color: #5f6368;
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-size: 12px;
      color: #5f6368;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #1a73e8;
      color: #fff;
      padding: 10px 14px;
      font: 600 14px system-ui, sans-serif;
      cursor: pointer;
    }
    #status {
      min-height: 20px;
      margin-top: 12px;
      color: #188038;
    }
  </style>
</head>
<body>
  <main>
    <h1>Laura for Meetings</h1>
    <p>Choose which Laura backend the in-meeting button should call.</p>

    <label for="apiBase">Laura backend URL</label>
    <input id="apiBase" type="url" placeholder="https://dhfgfe6yw6.eu-central-1.awsapprunner.com" />

    <button id="save" type="button">Save</button>
    <div id="status" role="status"></div>
  </main>

  <script src="options.js"></script>
</body>
</html>
