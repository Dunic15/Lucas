# Alembic config for the Laura multi-tenancy control plane.
#
# Only relevant when LAURA_DATABASE_URL is set (a Supabase Postgres URL). The
# key-free SQLite demo NEVER runs Alembic — env.py is a no-op when the URL is
# empty, and the URL is read from settings (config.py), NOT hard-coded here, so
# no secret ever lands in git.
#
#   Apply:  cd backend && LAURA_DATABASE_URL=postgresql+psycopg://... alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally omitted — env.py pulls it from
# settings.laura_database_url so the connection string stays out of the repo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
